<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ───────────────────────────────────────────────────────────────────────────────────────
 * Tokens — copiados tal cual de design/tokens/*.css (`_45`, 13/08/2026).
 * No se editan a mano: si el paquete de diseño cambia, se vuelven a copiar de ahí.
 * ─────────────────────────────────────────────────────────────────────────────────── */
:root{
--color-white:#ffffff;
--gray-50:#f8f9fa;--gray-100:#f1f3f4;--gray-200:#e8eaed;--gray-300:#dadce0;--gray-400:#bdc1c6;
--gray-500:#9aa0a6;--gray-600:#80868b;--gray-700:#5f6368;--gray-800:#3c4043;--gray-900:#202124;
--blue-50:#e8f0fe;--blue-500:#1a73e8;--blue-600:#1967d2;--blue-700:#185abc;
--red-50:#fce8e6;--red-600:#c5221f;
--amber-50:#fef7e0;--amber-600:#b06000;
--green-50:#e6f4ea;--green-600:#188038;
--text-primary:var(--gray-900);--text-secondary:var(--gray-700);--text-tertiary:var(--gray-600);
--text-disabled:var(--gray-500);--text-link:var(--blue-600);--text-on-primary:#ffffff;
--surface-page:#ffffff;--surface-sunken:var(--gray-50);--surface-hover:var(--gray-100);
--border-subtle:var(--gray-200);--border-default:var(--gray-300);
--color-primary:var(--blue-500);--color-primary-hover:var(--blue-600);--color-primary-active:var(--blue-700);
--surface-primary-subtle:var(--blue-50);
--color-error:var(--red-600);--surface-error-subtle:var(--red-50);
--color-warning:var(--amber-600);--surface-warning-subtle:var(--amber-50);
--color-success:var(--green-600);--surface-success-subtle:var(--green-50);
--color-disabled-bg:var(--gray-200);--color-disabled-fg:var(--gray-500);
--font-sans:'Roboto',Arial,sans-serif;
--text-2xs:11px;--text-xs:12px;--text-sm:13px;--text-base:14px;--text-md:16px;--text-lg:20px;--text-xl:24px;
--tracking-label:.4px;
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-pill:999px;
--shadow-sm:0 1px 2px rgba(60,64,67,.30),0 1px 3px 1px rgba(60,64,67,.15);
--ease-standard:cubic-bezier(.4,0,.2,1);--duration-fast:120ms;--duration-normal:200ms;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);font-size:var(--text-base);color:var(--text-primary);
  background:var(--surface-sunken);
  padding:var(--space-8) var(--space-6);
  display:flex;justify-content:center;align-items:flex-start;min-height:100vh;
}

/* La tarjeta. `overflow:hidden` para que la banda del pie respete el radio de 12. */
.panel{
  width:100%;max-width:560px;background:var(--surface-page);
  border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.panel-body{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}

/* ── Encabezado ───────────────────────────────────────────────────────────────────── */
.head{display:flex;flex-direction:column;gap:var(--space-3)}
/* `align-self:flex-start` es obligatorio: dentro de un flex column el logo se estira. */
.logo{height:22px;width:auto;align-self:flex-start;display:block}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
h1{font-size:var(--text-lg);font-weight:500;margin:0;line-height:1.2}
.chip{
  font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-label);
  border:1px solid var(--border-default);border-radius:var(--radius-pill);
  padding:3px 8px;color:var(--text-tertiary);white-space:nowrap;
}

/* ── Pestañas ─────────────────────────────────────────────────────────────────────── */
.tabs{
  display:flex;background:var(--surface-sunken);border-radius:var(--radius-pill);
  padding:3px;gap:2px;white-space:nowrap;
}
.tab{
  flex:1;border:0;background:transparent;font:inherit;font-size:var(--text-sm);
  color:var(--text-secondary);padding:6px 10px;border-radius:var(--radius-pill);
  cursor:pointer;transition:background var(--duration-fast) var(--ease-standard);
  display:flex;align-items:center;justify-content:center;gap:var(--space-1);
}
.tab:hover:not(.is-active){background:var(--surface-hover)}
.tab.is-active{background:var(--color-white);box-shadow:var(--shadow-sm);color:var(--text-primary);font-weight:500}
.tab-count{font-size:var(--text-2xs);color:var(--color-primary);font-weight:500}

/* ── Formularios ──────────────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:var(--space-2)}
label{font-size:var(--text-sm);font-weight:500;color:var(--text-secondary)}
select,input[type=text]{
  font:inherit;font-size:var(--text-base);color:var(--text-primary);
  padding:8px 10px;border:1px solid var(--border-default);border-radius:var(--radius-sm);
  background:var(--surface-page);width:100%;
}
select:focus,input[type=text]:focus{outline:2px solid var(--color-primary);outline-offset:-1px;border-color:transparent}
.hint{font-size:var(--text-xs);color:var(--text-tertiary);line-height:1.4}
.hint-error{font-size:var(--text-xs);color:var(--color-error);line-height:1.4}

.check{display:flex;align-items:flex-start;gap:var(--space-2);cursor:pointer}
.check input{margin:2px 0 0 0;accent-color:var(--color-primary);width:16px;height:16px;flex:none}
.check-text{display:flex;flex-direction:column;gap:2px}
.check-label{font-size:var(--text-sm);color:var(--text-primary)}
.check-sub{font-size:var(--text-xs);color:var(--text-tertiary)}

.btn{
  font:inherit;font-size:var(--text-base);font-weight:500;border-radius:var(--radius-sm);
  padding:10px 16px;cursor:pointer;border:1px solid transparent;width:100%;
  transition:background var(--duration-fast) var(--ease-standard);
}
.btn-primary{background:var(--color-primary);color:var(--text-on-primary)}
.btn-primary:hover:not(:disabled){background:var(--color-primary-hover)}
.btn-primary:active:not(:disabled){background:var(--color-primary-active)}
.btn-secondary{background:var(--surface-page);color:var(--color-primary);border-color:var(--border-default)}
.btn-secondary:hover:not(:disabled){background:var(--surface-hover)}
.btn:disabled{background:var(--color-disabled-bg);color:var(--color-disabled-fg);cursor:not-allowed;border-color:transparent}

/* ── Alert ────────────────────────────────────────────────────────────────────────── */
.alert{border-radius:var(--radius-md);padding:var(--space-3);font-size:var(--text-sm);line-height:1.4}
.alert-title{font-weight:500;margin-bottom:2px}
.alert-warning{background:var(--surface-warning-subtle);color:var(--color-warning)}
.alert-error{background:var(--surface-error-subtle);color:var(--color-error)}
.alert-info{background:var(--surface-primary-subtle);color:var(--text-link)}

/* ── DeckLinkCard ─────────────────────────────────────────────────────────────────── */
.deck{
  display:block;border:1px solid var(--border-default);border-radius:var(--radius-md);
  padding:var(--space-3);text-decoration:none;background:var(--surface-page);
  transition:background var(--duration-fast) var(--ease-standard);
}
.deck:hover{background:var(--surface-hover)}
.deck-name{font-size:var(--text-base);font-weight:500;color:var(--text-link);margin-bottom:2px}
.deck-meta{font-size:var(--text-xs);color:var(--text-tertiary)}

/* ── StatRow ──────────────────────────────────────────────────────────────────────── */
.stats{display:flex;flex-direction:column}
.stat{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle);
}
.stat:last-child{border-bottom:0}
.stat-label{font-size:var(--text-sm);color:var(--text-secondary)}
.stat-unit{font-size:var(--text-xs);color:var(--text-tertiary);display:block}
.stat-value{font-size:var(--text-md);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── StatusDot ────────────────────────────────────────────────────────────────────── */
.dot-row{display:flex;align-items:center;gap:var(--space-2);padding:3px 0;font-size:var(--text-sm)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot-on{background:var(--color-success)}
.dot-off{background:transparent;border:1px solid var(--border-strong,var(--gray-400))}

/* ── ProgressTimer ────────────────────────────────────────────────────────────────── */
.timer-top{display:flex;align-items:baseline;justify-content:space-between}
.timer-secs{font-size:var(--text-lg);font-variant-numeric:tabular-nums;font-weight:500}
.timer-stage{font-size:var(--text-xs);color:var(--text-tertiary)}
/* La regla NO avanza sola hacia 100 %: la banda marca el rango habitual y el marcador
 * se mueve con el tiempo real. Una barra que se llena sola sería una mentira. */
.rule{position:relative;height:6px;background:var(--gray-200);border-radius:var(--radius-pill);margin:var(--space-2) 0}
.rule-band{position:absolute;top:0;bottom:0;background:var(--blue-50);border-radius:var(--radius-pill)}
.rule-mark{
  position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--color-primary);
  transition:left var(--duration-normal) var(--ease-standard);
}
.rule-mark.is-warn{background:var(--color-warning)}
.rule-mark.is-danger{background:var(--color-error)}
.rule-scale{display:flex;justify-content:space-between;font-size:var(--text-2xs);color:var(--text-tertiary)}

/* ── RunHistoryItem ───────────────────────────────────────────────────────────────── */
.run{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle);
}
.run:last-child{border-bottom:0}
.run-name{font-size:var(--text-sm);font-weight:500}
.run-when{font-size:var(--text-xs);color:var(--text-tertiary)}
.run-when.is-dead{color:var(--color-error)}
.run-count{font-size:var(--text-xs);color:var(--text-tertiary);white-space:nowrap}
/* `2026-09-01_3` B.1 - la fila de una corrida cerrada CON deck es un enlace.
 * Hereda el aspecto de `.run` y sólo agrega la señal de que se puede apretar: sin el color de
 * enlace en el nombre, el link existe y nadie lo ve. Mismo criterio que `.deck`, que también es
 * un `<a>` de bloque. */
a.run-link{text-decoration:none;color:inherit}
a.run-link .run-name{color:var(--text-link)}
a.run-link:hover{background:var(--surface-hover)}

.sep{border:0;border-top:1px solid var(--border-subtle);margin:0}
.box{background:var(--surface-sunken);border-radius:var(--radius-md);padding:var(--space-3);font-size:var(--text-sm)}
.muted{font-size:var(--text-xs);color:var(--text-tertiary);line-height:1.4}
.list-reset{list-style:none;margin:0;padding:0}
.cuadro{border:1px solid var(--border-default);border-radius:var(--radius-md,6px);padding:var(--space-3);margin-bottom:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)}
.cuadro-tit{font-size:var(--text-sm);color:var(--text-primary);font-weight:600}
.cuadro-secs{font-size:var(--text-xs);color:var(--text-tertiary)}
.cuadro-est{font-size:var(--text-xs);color:var(--text-secondary)}
.cuadro-msg{font-size:var(--text-xs);color:var(--text-secondary)}
.cuadro-btns{display:flex;gap:var(--space-2)}
.temario{width:100%;font-family:var(--font-mono,monospace);font-size:var(--text-xs);padding:var(--space-2);border:1px solid var(--border-default);border-radius:var(--radius-sm,4px);background:var(--surface-page);color:var(--text-primary);resize:vertical}
.alerta{color:var(--color-error)}
.mono{font-family:var(--font-mono,monospace)}
.section-title{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-tertiary)}

/* ── Faltantes · `2026-08-23_1` Parte B ───────────────────────────────────────────── */
/* Sin componentes nuevos donde alcanza uno viejo: `.run-name`, `.run-when`, `.run-count`,
 * `.stats` y `.alert` son los mismos de las otras pestañas. Lo que sí necesita forma propia es
 * el grupo plegable por causa, que no existe en ningún otro lado. */
.falt-switch{display:flex;gap:var(--space-2)}
.falt-switch .btn.is-on{
  background:var(--surface-primary-subtle);color:var(--text-link);
  border-color:var(--color-primary);
}
.falt-grupo{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
/* El borde izquierdo, y no un fondo rojo: lo que frena la publicación ya tiene su alerta
 * arriba. Acá alcanza con poder encontrarlo al bajar. */
.falt-grupo.is-frena{border-left:3px solid var(--color-error)}
.falt-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3);cursor:pointer;background:var(--surface-page);
}
.falt-head:hover{background:var(--surface-hover)}
.falt-lista{border-top:1px solid var(--border-subtle);background:var(--surface-sunken)}
.falt-token{padding:var(--space-3);border-bottom:1px solid var(--border-subtle)}
.falt-token:last-child{border-bottom:0}
/* El motivo es la traza del motor: monoespaciada, chica, y **entera**. Recortarla con
 * ellipsis escondería justo la parte que dice por qué falló. */
.falt-motivo{
  font-family:var(--font-mono,monospace);font-size:var(--text-2xs);
  color:var(--text-secondary);line-height:1.5;margin-top:4px;
  overflow-wrap:anywhere;
}

/* ── El número del cierre de fase · `2026-08-24_2` Parte E ────────────────────────────
 * ⭐ **Un solo número grande, y los otros dos en la fila de `stats` de abajo, en gris.** La
 * jerarquía es por CONSECUENCIA: `real` es el único que decide si la fase cierra (`D-38`), y
 * ponerlo del mismo tamaño que «fuera de alcance» haría que los tres se lean como equivalentes —
 * que es exactamente el problema que la Parte B vino a arreglar, movido a la tipografía.
 *
 * ⚠ **Sin color de alerta a propósito.** Un deck con faltantes reales es **normal y publicable**;
 * lo que frena la publicación son las dos causas de `CAUSAS_QUE_FRENAN`, y ésas ya tienen su alerta
 * roja arriba de todo. Pintar este número de rojo competiría con la que sí importa. */
.falt-cierre{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3);border-radius:var(--radius-md);
  background:var(--surface-sunken);border-left:3px solid var(--color-primary);
}
.falt-cierre-num{
  flex:none;font-size:var(--text-2xl,28px);font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--text-primary);
}
.falt-cierre-tit{font-weight:600;font-size:var(--text-sm)}

/* ── Veredicto de publicación y leyenda · `2026-08-23_1` Parte E ───────────────────── */
/* Tres estados y no dos: «no está completo», «se puede con reparos» y «terminó entera».
 * El color va en el borde izquierdo y en el título, no en un fondo saturado: esto se lee de
 * arriba de la pantalla, y un bloque rojo lleno compite con el link al deck que está debajo. */
.veredicto{
  border-radius:var(--radius-md);padding:var(--space-3);
  border-left:3px solid var(--border-default);background:var(--surface-sunken);
  font-size:var(--text-sm);line-height:1.45;
}
.veredicto-tit{font-weight:500;margin-bottom:var(--space-2)}
.veredicto li{margin-bottom:var(--space-2)}
.veredicto li:last-child{margin-bottom:0}
/* Los reparos, cuando hay frenos, van más chicos: son ciertos y no son lo que frena. */
.veredicto-menor{margin-top:var(--space-2);font-size:var(--text-xs);color:var(--text-secondary)}
.veredicto.is-freno{border-left-color:var(--color-error);background:var(--surface-error-subtle)}
.veredicto.is-freno .veredicto-tit{color:var(--color-error)}
.veredicto.is-reparo{border-left-color:var(--color-warning);background:var(--surface-warning-subtle)}
.veredicto.is-reparo .veredicto-tit{color:var(--color-warning)}
.veredicto.is-ok{border-left-color:var(--color-success)}
.veredicto.is-ok .veredicto-tit{color:var(--color-success)}

/* El glifo con ancho fijo: la gracia de la leyenda es poder barrer la columna de símbolos
 * de un vistazo y encontrar el que se tiene delante. */
.leyenda{display:flex;gap:var(--space-3);align-items:baseline;padding:3px 0;font-size:var(--text-sm)}
.leyenda-glifo{flex:none;min-width:72px;color:var(--text-secondary)}

/* ── Pie institucional, a sangre ──────────────────────────────────────────────────── */
.banner{display:block;width:100%;height:auto}
</style>
</head>

 * afirma un contrato*: una premisa sin testigo, que sobrevive porque nada la contradice. **La
 * lista no se reemplaza por otra lista**, que envejecería igual: se reemplaza por la regla, y

 *
 * El 350 queda como semilla hasta que llega `panel_getEstado`, y sólo por eso. */

  /* ⭐⭐ `2026-08-27_1` — **el asistente lineal de cuatro pasos** (`D-44`).
   *
   * `paso` es en qué pantalla está la persona. **No es la guarda**: la guarda vive en
   * `guardaDelAsistente_`, en el backend, y mira hechos de las hojas vivas. Esto es sólo qué se
   * pinta — un front que se guarda a sí mismo es el `TECHO_S = 350` otra vez.
   *
   * ⭐ **`reiniciarAsistente()` es la mitad del diseño lineal:** cambiar el período tira todo lo
   * de abajo. Si el período se pudiera cambiar después de cargar el temario, las reuniones
   * quedarían atadas al `periodo_id` viejo — **el diseño lo hace imposible en vez de tener que
   * detectarlo.** */
  asis: null
};

/** El estado inicial del asistente. Volver acá **es** empezar de nuevo. */
function asistenteVacio(){
  return {
    paso: 1,
    opciones: null,          // null = sin pedir; lo trae `panel_asistenteOpcionesDePeriodo`
    modo: '',                // en_curso | anterior | personalizado
    periodoId: '', desde: '', hasta: '', sinCerrar: false,
    cargado: null,          // lo que devolvió el paso 2; null = todavía no se cargó
    confirmar: null,        // lo que devolvió `panel_asistentePaso3`; null = sin pedir
    checks: null,           // clave -> bool, para que el repintado no pierda lo tildado
    anclaje: null,          // las tres listas, tal como volvieron de confirmar
    sinFila: [],            // decisiones que no matchearon ninguna fila
    canales: null,          // qué canales se consultaron y cuáles fallaron (2026-08-28)
    puedeGenerar: false,
    msg: null,
    trabajando: false
  };
}
function asis(){
  if (!S.asis) S.asis = asistenteVacio();
  return S.asis;
}
/* ⭐ Cambiar el período es empezar de nuevo, y por eso esto no conserva nada. */
function reiniciarAsistente(){ S.asis = asistenteVacio(); pintar(); }

/* ── utilidades ──────────────────────────────────────────────────────────────────── */
function esc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(v){
  if (v === null || v === undefined || v === '') return '—';
  var n = Number(v);
  return isNaN(n) ? esc(v) : n.toLocaleString('es-AR');
}
function el(id){ return document.getElementById(id); }
function informeActual(){
  for (var i=0;i<S.informes.length;i++) if (S.informes[i].id === S.informeId) return S.informes[i];
  return null;
}
/* Una corrida cerrada de este informe Y de este período, para la vía rápida.
 *
 * Antes cruzaba sólo por informe y devolvía la más nueva, así que cambiar el período no
 * cambiaba el deck ofrecido: mostraba siempre el mismo. El backend ya devuelve `periodo_id`.
 *
 * El caso "por defecto" necesita traducción, y conviene saber por qué. La columna guarda
 * `periodoId || origen`, o sea **dos vocabularios**: un id de la lista de períodos si alguien
 * lo eligió, y la etiqueta de la cadena que lo resolvió si no. Medido el 13/08, las corridas
 * reales traen ids (`julio_24_30`, `junio_sem2`), pero la etiqueta puede aparecer igual.
 *
 * Con el selector en "por defecto" no hay id que comparar, así que se busca el período de la
 * lista **cuya ventana coincide** con la que el motor resolvería hoy. No es derivar el período
 * de la fecha de generación —eso sería adivinar—: es preguntar cuál de los períodos
 * registrados ES el que va a salir.
 *
 * ⚠ **Y si ninguno coincide, no se ofrece nada — no se cae a la etiqueta.** Medido el 13/08:
 * **37 de las 51 corridas tienen `config`**, y el período real de cada una es indeterminable,
 * porque depende de qué decía `CONFIG` ese día. Emparejar contra la etiqueta ofrecería la más
 * nueva de esas 37 como si fuera del período elegido, que es exactamente **abrir el deck
 * equivocado** — el error que esta vía rápida existe para evitar. No ofrecer nada cuesta una
 * generación de más; ofrecer el equivocado cuesta una reunión.
 *
 * Tres cosas que NO emparejan, y las tres a propósito:
 *   - una corrida con `periodo_id` vacío — no se le asigna el período elegido "porque es la
 *     más nueva", que es justamente el error que esto viene a arreglar;
 *   - una que no cerró — no tiene deck que ofrecer;
 *   - una de otro período — aunque sea la única que haya.
 * La lista viene de la más nueva a la más vieja, así que el primer match es el más reciente. */
function periodoBuscado(){
  if (S.periodoId) return S.periodoId;
  if (!S.porDefecto || !S.porDefecto.ok) return '';
  for (var i=0;i<S.periodos.length;i++){
    var p = S.periodos[i];
    if (p.desde === S.porDefecto.desde && p.hasta === S.porDefecto.hasta) return p.id;
  }
  return '';
}

function corridaPrevia(){
  if (!S.corridas || !S.informeId) return null;
  var buscado = periodoBuscado();
  if (!buscado) return null;
  for (var i=0;i<S.corridas.length;i++){
    var c = S.corridas[i];
    if (c.informe_id !== S.informeId) continue;
    if (!c.cerrada || !c.deck_id) continue;
    if (!c.periodo_id) continue;
    if (c.periodo_id !== buscado) continue;
    return c;
  }
  return null;
}

/* ── arranque ────────────────────────────────────────────────────────────────────── */
function arrancar(){
  google.script.run
    .withSuccessHandler(function(r){
      S.cargando = false;
      if (!r || !r.ok){ S.error = (r && r.motivo) || 'El backend no devolvió estado.'; pintar(); return; }
      S.informes = r.informes || [];
      S.periodos = r.periodos || [];
      S.porDefecto = r.por_defecto || null;
      S.informeActivo = r.informe_activo || '';
      // El techo real, de CONFIG. Sin esto la regla dibuja una escala que el motor no usa.
      if (r.reloj && r.reloj.techo_seg > 0){ TECHO_S = r.reloj.techo_seg; MURO_S = r.reloj.muro_seg || 360; }
      S.informeId = S.informeActivo || (S.informes[0] && S.informes[0].id) || '';
      resetSecciones();
      pintar();
      cargarCorridas();
    })
    .withFailureHandler(function(e){
      S.cargando = false;
      S.error = (e && e.message) || String(e);
      pintar();
    })
    .panel_getEstado();
}

function cargarCorridas(){
  S.corridasCargando = true;
  google.script.run
    .withSuccessHandler(function(r){
      S.corridasCargando = false;
      S.corridas = (r && r.ok) ? r.corridas : [];
      pintar();
    })
    .withFailureHandler(function(){ S.corridasCargando = false; S.corridas = []; pintar(); })
    .panel_ultimasCorridas(10);
}

/* Al cambiar de informe se retildan todas: las secciones son de ESE informe. */
function resetSecciones(){
  S.secciones = {};
  var inf = informeActual();
  if (inf) (inf.secciones||[]).forEach(function(s){ S.secciones[s.id] = true; });
}

/* ── generar ─────────────────────────────────────────────────────────────────────── */
function generar(){
  S.estado = 'generando';
  S.elapsed = 0;
  S.resultado = null;
  S.motivo = null;
  pintar();

  /* `google.script.run` es bloqueante y no reporta avance, así que el contador corre del
   * lado del cliente desde el click. El callback lo frena — nunca al revés. */
  S.tick = setInterval(function(){ S.elapsed++; pintarTimer(); }, 1000);

  var elegidas = [];
  Object.keys(S.secciones).forEach(function(k){ if (S.secciones[k]) elegidas.push(k); });

  google.script.run
    .withSuccessHandler(function(r){
      clearInterval(S.tick); S.tick = null;
      if (!r || !r.ok){ S.estado = 'fallo'; S.motivo = (r && r.motivo) || 'Sin motivo.'; pintar(); return; }
      S.estado = 'listo'; S.resultado = r; pintar(); cargarCorridas();
    })
    .withFailureHandler(function(e){
      clearInterval(S.tick); S.tick = null;
      S.estado = 'fallo'; S.motivo = (e && e.message) || String(e); pintar();
    })
    .panel_generar(S.informeId, S.periodoId, S.conSimbolos, elegidas);
}

/* ⭐ `2026-08-21_19` Parte A — **el mismo formulario, el otro motor.**
 *
 * ⚠ **Manda exactamente lo mismo que `generar()`**, y eso no es una comodidad: es la diferencia
 * entre `agosto_14_20` y `R-11 (calculado)`. Una corrida arrancada sin el período **da la misma
 * ventana de fechas y otro temario** —`anclarEncuentros` sólo recorta `REUNIONES` cuando el
 * origen empieza con `periodo_ref:`—, y el 21/08 eso puso seis encuentros de junio y julio en un
 * deck sin que nada fallara. El botón no puede perder lo que la persona eligió en pantalla.
 *
 * **No hay cronómetro y no es un olvido:** esto vuelve en segundos porque sólo arranca la
 * ejecución 1; lo que tarda pasa después, en el servidor, y se mira en la pestaña «Corrida». */
function generarDesatendida(){
  S.desArranque = null;
  S.desMsg = null;
  S.estado = 'generando';
  S.elapsed = 0;
  pintar();
  S.tick = setInterval(function(){ S.elapsed++; pintarTimer(); }, 1000);

  var elegidas = [];
  Object.keys(S.secciones).forEach(function(k){ if (S.secciones[k]) elegidas.push(k); });

  google.script.run
    .withSuccessHandler(function(r){
      clearInterval(S.tick); S.tick = null;
      S.estado = 'form';
      S.desArranque = r || { ok:false, motivo:'El backend no devolvió nada.' };
      // Se salta a la pestaña que muestra el avance: es donde está lo que sigue pasando.
      S.tab = 'desatendida';
      cargarDesatendida();
      cargarCorridas();
    })
    .withFailureHandler(function(e){
      clearInterval(S.tick); S.tick = null;
      S.estado = 'fallo'; S.motivo = (e && e.message) || String(e); pintar();
    })
    .panel_generarDesatendida(S.informeId, S.periodoId, S.conSimbolos, elegidas);
}

/* Sólo lectura, y **sin autorefresco**: un botón de actualizar alcanza y **no esconde cuándo se
 * leyó**. Una pantalla que se refresca sola parece siempre actual aunque el backend haya dejado
 * de responder; una con la hora de lectura a la vista, no. */
function cargarDesatendida(){
  S.desCargando = true;
  pintar();
  google.script.run
    .withSuccessHandler(function(r){
      S.desCargando = false;
      S.des = r || { ok:false, motivo:'El backend no devolvió estado.' };
      pintar();
    })
    .withFailureHandler(function(e){
      S.desCargando = false;
      S.des = { ok:false, motivo:(e && e.message) || String(e) };
      pintar();
    })
    .panel_estadoDesatendida();
}

/* ⭐ **El freno.** Un mecanismo desatendido sin botón de freno es peor que ninguno.
 *
 * ⚠ **Con confirmación**, porque no es reversible: cancelar borra el trigger y el estado, y el
 * deck queda a medio hacer. Y el texto dice **qué queda**, no sólo qué se pierde — el deck y el
 * plan no se tocan, que es lo que hay para mirar después. */
function cancelarDesatendida(){
  var d = S.des || {};
  if (!window.confirm('Frenar la corrida ' + (d.corrida_id || '') + '?\n\n' +
      'Se borra el trigger que la reanuda. El deck queda a medio hacer, con sus tokens sin ' +
      'pintar, y el plan queda como está: es lo que hay para mirar. No se puede deshacer — ' +
      'para terminarlo hay que generar de nuevo.')) return;

  S.desCargando = true;
  pintar();
  google.script.run
    .withSuccessHandler(function(r){
      S.desMsg = (r && r.habia)
        ? { ok:true, texto:'Frenada la corrida ' + (r.corrida_id || '') + '. Triggers borrados: ' +
            (r.triggers_borrados || 0) + '.' }
        // «No había ninguna» NO se festeja como cancelación: una operación que no hizo nada
        // tiene que decirlo, no informar éxito (`CLAUDE.md` §4).
        : { ok:false, texto:'No había ninguna corrida desatendida en curso. No se frenó nada; ' +
            'triggers borrados: ' + ((r && r.triggers_borrados) || 0) + '.' };
      cargarDesatendida();
    })
    .withFailureHandler(function(e){
      S.desCargando = false;
      S.desMsg = { ok:false, texto:'No se pudo frenar: ' + ((e && e.message) || String(e)) };
      pintar();
    })
    .panel_cancelarDesatendida();
}

/* ── pintado ─────────────────────────────────────────────────────────────────────── */

/* ── `2026-08-19_2` Parte D — los cuadrados ──────────────────────────────────────────
 *
 * ⚠ **Nada de lógica de negocio acá.** Qué secciones alimenta un cuadrado y qué modo tiene lo
 * decide `cuadradosDeInforme_` en el backend. Si el HTML lo derivara habría dos definiciones del
 * mismo mapa, y **la del HTML no tiene prueba**. Esto sólo pinta lo que llega. */
function pintarCuadrados(){
  var inf = informeActual();
  var cuadros = (inf && inf.cuadrados) || [];
  if (!cuadros.length) return '';

  var h = '<div class="bloque"><span class="section-title">Carga por sección</span>';

  cuadros.forEach(function(c){
    h += '<div class="cuadro">';
    h += '<div class="cuadro-tit">' + esc(c.titulo) + '</div>';

    // Las secciones que alimenta, con su filtro. Es lo que hace visible que UN temario
    // alimenta DOS secciones.
    h += '<div class="cuadro-secs">' + c.secciones.map(function(s){
      return esc(s.nombre) + (s.filtro ? ' <span class="mono">(' + esc(s.filtro) + ')</span>' : '');
    }).join(' · ') + '</div>';

    if (c.modo === 'temario'){
      var t = c.temario || {};
      h += '<textarea class="temario" id="ta-' + esc(c.clave) + '" rows="6" ' +
           'placeholder="Pegá el temario acá, o apretá Proponer."></textarea>';
      h += '<div class="cuadro-btns">' +
           '<button class="btn btn-secondary" data-proponer="' + esc(c.clave) + '"' +
             (t.puede_proponer ? '' : ' disabled') + '>Proponer</button>' +
           '<button class="btn btn-primary" data-cargar="' + esc(c.clave) + '">Cargar</button>' +
           '</div>';
      /* ⭐ `2026-08-26_2` Parte B — **la ventana también en el cuadro de TEMARIO.** Acá se
       * mostraban *filas cargadas* y nada de la ventana, así que la pregunta *«¿sobre qué
       * período estoy cargando esto?»* sólo se contestaba mirando el desplegable de arriba.
       *
       * ⚠ **El dato ya viajaba**: `panel_getEstado` manda `c.ventana` con etiqueta, fechas y
       * origen para **todos** los cuadros, y el front lo pintaba sólo en la rama de abajo —la
       * de los que no son temario ni manuales—. No hizo falta tocar el backend. */
      if (c.ventana){
        h += '<div class="cuadro-est mono">Ventana: ' + esc(c.ventana.etiqueta) +
             (c.ventana.origen ? ' · ' + esc(nivelDeVentana(c.ventana.origen)) : '') + '</div>';
      }
      h += '<div class="cuadro-est" id="est-' + esc(c.clave) + '">' +
           (S.periodoId
             ? (t.filas_cargadas || 0) + ' fila(s) cargada(s) para <span class="mono">' + esc(S.periodoId) + '</span>' +
               (t.sin_confirmar ? ' · <span class="alerta">' + t.sin_confirmar + ' sin confirmar</span>' : '')
             : 'Elegí un período de la lista para ver qué hay cargado y para poder cargar.') +
           '</div>';
      if (S.temarioMsg[c.clave]){
        h += '<div class="cuadro-msg' + (S.temarioMsg[c.clave].error ? ' alerta' : '') + '">' +
             esc(S.temarioMsg[c.clave].texto) + '</div>';
      }
    } else if (c.modo === 'manual'){
      h += '<div class="cuadro-est">Se carga a mano' + (c.motivo ? ' — ' + esc(c.motivo) : '') + '</div>';
    } else {
      h += '<div class="cuadro-est">' +
           (c.ventana ? 'Ventana: ' + esc(c.ventana.etiqueta) + ' <span class="mono">(' + esc(nivelDeVentana(c.ventana.origen)) + ')</span>'
                      : 'Sin ventana resuelta') +
           (c.motivo ? '<br><span class="alerta">' + esc(c.motivo) + '</span>' : '') +
           '</div>';
    }

    h += '</div>';
  });

  return h + '</div>';
}

function conectarCuadrados(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-proponer]'), function(b){
    b.onclick = function(){
      var clave = b.getAttribute('data-proponer');
      S.temarioMsg[clave] = { texto: 'Proponiendo…', error: false };
      pintar();
      google.script.run
        .withSuccessHandler(function(r){
          if (!r || !r.ok){
            S.temarioMsg[clave] = { texto: (r && r.motivo) || 'No se pudo proponer.', error: true };
            pintar(); return;
          }
          /* El texto va a la caja y NO se escribe ninguna fila: `R-02`, el temario define el
           * universo del informe y la ventana sólo calcula. La persona lo edita y recién
           * entonces aprieta Cargar. */
          var ta = el('ta-' + clave);
          if (ta) ta.value = r.texto || '';
          S.temarioMsg[clave] = {
            texto: r.propuestas
              ? r.propuestas + ' línea(s) propuesta(s) sobre ' + r.ventana.etiqueta +
                (r.afuera && r.afuera.length ? ' · ' + r.afuera.length + ' fuera, ver detalle' : '') +
                ' — revisalas y apretá Cargar.'
              : (r.motivo_vacio || 'No hay nada para proponer en esta ventana.'),
            error: false
          };
          pintar();
          var ta2 = el('ta-' + clave);
          if (ta2) ta2.value = r.texto || '';
        })
        .withFailureHandler(function(e){
          S.temarioMsg[clave] = { texto: (e && e.message) || String(e), error: true };
          pintar();
        })
        .panel_proponerTemario(clave, S.periodoId);
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-cargar]'), function(b){
    b.onclick = function(){
      var clave = b.getAttribute('data-cargar');
      var ta = el('ta-' + clave);
      var texto = ta ? ta.value : '';
      S.temarioMsg[clave] = { texto: 'Cargando…', error: false };
      pintar();
      google.script.run
        .withSuccessHandler(function(r){
          if (!r || !r.ok){
            S.temarioMsg[clave] = { texto: (r && r.motivo) || 'No se pudo cargar.', error: true };
            pintar(); return;
          }
          var partes = [];
          if (r.agregadas !== undefined) partes.push(r.agregadas + ' agregada(s)');
          if (r.escritas !== undefined) partes.push(r.escritas.length + ' agregada(s)');
          if (r.salteadas && r.salteadas.length) partes.push(r.salteadas.length + ' ya estaba(n)');
          if (r.sinParsear) partes.push(r.sinParsear + ' sin parsear');
          if (r.sinId && r.sinId.length) partes.push(r.sinId.length + ' sin id');
          S.temarioMsg[clave] = { texto: partes.join(' · ') || 'Listo.', error: false };
          refrescarEstado();
        })
        .withFailureHandler(function(e){
          S.temarioMsg[clave] = { texto: (e && e.message) || String(e), error: true };
          pintar();
        })
        .panel_cargarTemario(clave, texto, S.periodoId, S.informeId);
    };
  });
}

/* Vuelve a pedir el estado para que los cuadrados cuenten sobre el período elegido. */
function refrescarEstado(){
  google.script.run
    .withSuccessHandler(function(r){
      if (r && r.ok){
        S.informes = r.informes || S.informes;
        if (r.reloj && r.reloj.techo_seg > 0){ TECHO_S = r.reloj.techo_seg; MURO_S = r.reloj.muro_seg || 360; }
        S.porDefecto = r.por_defecto || S.porDefecto;
      }
      pintar();
    })
    .withFailureHandler(function(){ pintar(); })
    .panel_getEstado(S.periodoId);
}

function pintar(){
  pintarTabs();
  var c = el('cuerpo');
  if (S.cargando){ c.innerHTML = '<p class="muted">Cargando el estado del motor…</p>'; return; }
  if (S.error){
    c.innerHTML = '<div class="alert alert-error"><div class="alert-title">No se pudo leer el estado.</div>' +
      esc(S.error) + '</div>';
    return;
  }
  if (S.tab === 'asistente'){ c.innerHTML = vistaAsistente(); conectarAsistente(); return; }
  if (S.tab === 'corridas') { c.innerHTML = vistaCorridas(); return; }
  if (S.tab === 'anclajes') { c.innerHTML = vistaAnclajes(); return; }
  if (S.tab === 'faltantes'){ c.innerHTML = vistaFaltantes(); conectarFaltantes(); return; }
  if (S.tab === 'proximo')  { c.innerHTML = vistaProximo(); return; }
  if (S.tab === 'desatendida'){
    /* La primera vez que se entra a la pestaña se pide el estado. Va acá y no en el `onclick` de
     * la solapa para cubrir también la entrada desde el botón, que salta a esta pestaña sola.
     * No hay recursión: `cargarDesatendida` deja `desCargando` en `true` antes de repintar. */
    if (S.des === null && !S.desCargando){ cargarDesatendida(); return; }
    c.innerHTML = vistaDesatendida(); conectarDesatendida(); return;
  }
  c.innerHTML = vistaGenerar();
  conectarGenerar();
}

function pintarTabs(){
  var tabs = [
    /* ⭐ El asistente va PRIMERO porque es el proceso. «Generar» queda al lado, y eso es
     * deliberado: es el camino libre, y sigue haciendo falta para regenerar un deck de un período
     * ya armado sin volver a pasar por los cuatro pasos. */
    { id:'asistente', txt:'Asistente' },
    { id:'generar', txt:'Generar' },
    { id:'desatendida', txt:'Corrida' },
    { id:'anclajes', txt:'Anclajes' },
    { id:'faltantes', txt:'Faltantes' },
    { id:'corridas', txt:'Corridas' },
    { id:'proximo', txt:'Próximo' }
  ];
  el('tabs').innerHTML = tabs.map(function(t){
    return '<button class="tab' + (S.tab===t.id?' is-active':'') + '" data-tab="' + t.id + '">' +
      esc(t.txt) + '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    b.onclick = function(){ S.tab = b.getAttribute('data-tab'); pintar(); };
  });
}

/* ══════════════════════════════════════════════════════════════════════════════════════════
 * `2026-08-27_1` — **el asistente lineal de cuatro pasos** (`D-44`)
 * ══════════════════════════════════════════════════════════════════════════════════════════
 *
 * ⭐ **Lineal, no navegable.** Los pasos se hacen en orden y **cambiar el período es empezar de
 * nuevo**. Eso no es una limitación de la UI: es lo que previene el problema. Si el período se
 * pudiera cambiar después de cargar el temario, las reuniones quedarían atadas al `periodo_id`
 * viejo — **el diseño lo hace imposible en vez de tener que detectarlo.**
 *
 * ⛔ **Y el front NO se guarda a sí mismo.** El botón de cada paso llama a su `panel_asistente*`,
 * que consulta a `guardaDelAsistente_` con hechos leídos de las hojas vivas. Un `paso: 3` en este
 * objeto es qué se pinta, nunca un permiso. */
function barraDePasos(){
  var a = asis();
  var nombres = ['Período', 'Temario', 'Confirmar', 'Generar'];
  var h = '<div class="cuadro-secs" style="margin-bottom:10px">';
  h += nombres.map(function(n, i){
    var n1 = i + 1;
    var estado = (n1 < a.paso) ? '✅' : (n1 === a.paso ? '▶' : '·');
    return '<span class="' + (n1 === a.paso ? '' : 'muted') + '">' + estado + ' ' + n1 + ' ' + esc(n) + '</span>';
  }).join(' &nbsp;→&nbsp; ');
  return h + '</div>';
}

function vistaAsistente(){
  var a = asis();
  var h = '<div class="bloque"><span class="section-title">El informe de la semana, en cuatro pasos</span>';
  h += barraDePasos();

  if (a.paso === 1) h += pasoPeriodo();
  else if (a.paso === 2) h += pasoTemario();
  else if (a.paso === 3) h += pasoConfirmar();
  else h += pasoGenerar();

  if (a.msg){
    h += '<div class="alert ' + (a.msg.ok ? 'alert-info' : 'alert-warning') + '">' +
         '<div class="alert-title">' + (a.msg.ok ? 'Listo' : 'No se pudo') + '</div>' +
         esc(a.msg.texto) + '</div>';
  }
  return h + '</div>';
}

/* ── Paso 1 · el período ─────────────────────────────────────────────────────────────────
 *
 * ⭐ **Tres opciones, y son tres — no una lista que crece.** «Anterior» es lo que `R-11`
 * Addendum 2 propone por defecto; «en curso» lo deroga parcialmente **sólo cuando la persona lo
 * pide** (`D-43`); «personalizado» toma un rango a mano.
 *
 * ⭐⭐ **El aviso de datos parciales sale al ELEGIRLA, no al terminar.** Un número parcial no se
 * distingue de uno completo mirándolo, así que decirlo en un pie de página cuando el deck ya
 * salió no sirve de nada. Por eso las opciones se piden ANTES de dibujar los botones. */
function pasoPeriodo(){
  var a = asis();
  if (a.opciones === null){ cargarOpcionesDePeriodo(); return '<p class="muted">Mirando qué semana corresponde…</p>'; }
  if (a.opciones === 'cargando') return '<p class="muted">Mirando qué semana corresponde…</p>';
  if (!a.opciones.ok) return '<p class="hint-error">No se pudieron calcular las semanas: ' + esc(a.opciones.motivo || '') + '</p>';

  var h = '<p class="hint">Elegí sobre qué semana se arma el informe. <b>Es lo primero y no se ' +
          'cambia después</b>: cambiarlo es empezar de nuevo, porque el temario se carga atado a ' +
          'este período.</p>';

  a.opciones.opciones.forEach(function(o){
    var titulo = o.modo === 'anterior' ? 'La semana anterior (la última cerrada)' : 'La semana en curso';
    h += '<div class="cuadro">';
    h += '<div class="cuadro-tit">' + esc(titulo) + '</div>';
    h += '<div class="cuadro-est mono">' + esc(o.desde) + ' → ' + esc(o.hasta) + ' · ' + esc(o.periodo_id) + '</div>';
    /* ⭐⭐ El aviso ANTES del botón. */
    (o.avisos || []).forEach(function(t){ h += '<p class="hint-error">⚠ ' + esc(t) + '</p>'; });
    if (o.ya_existe){
      h += '<p class="hint">Ya existe en <span class="mono">PERIODOS</span>: se reusa, no se crea ' +
           'de nuevo ni se pisa.</p>';
    }
    h += '<div class="cuadro-btns"><button class="btn btn-primary" data-asis-per="' + esc(o.modo) + '">' +
         (o.ya_existe ? 'Usar ' : 'Crear y usar ') + esc(o.periodo_id) + '</button></div>';
    h += '</div>';
  });

  h += '<div class="cuadro"><div class="cuadro-tit">Un período a medida</div>' +
       '<div class="field">' +
       '<input id="asis-desde" type="date">' +
       '<input id="asis-hasta" type="date">' +
       '<button class="btn btn-secondary" id="asis-per-custom">Crear y usar</button>' +
       /* ⚠ El id se DERIVA. Dejar que alguien lo escriba reabre la puerta a
        * `'vie 14/08 -- jue 20/08 (por defecto)'`, que es una etiqueta usada como clave. */
       '<p class="hint">El nombre se arma solo, con la convención ' +
       '<span class="mono">AAAA_mes_ddInicio_ddFin</span>.</p></div></div>';

  if ((a.opciones.claves_repetidas || []).length){
    h += '<p class="hint-error">⛔ <span class="mono">PERIODOS</span> tiene claves repetidas: ' +
         esc(a.opciones.claves_repetidas.join(', ')) + '. <span class="mono">leerPeriodos()</span> ' +
         'las colapsa y ve menos filas de las que hay. Se reporta y no se toca, por decisión tuya.</p>';
  }
  return h;
}

/** El período elegido, arriba de cada paso. ⭐ Con «empezar de nuevo» al lado: es la única salida,
 * y tiene que estar a la vista para que la linealidad no se lea como estar atrapado. */
function cabezalDelPeriodo(){
  var a = asis();
  return '<p class="hint">Período: <span class="mono">' + esc(a.periodoId) + '</span> · ' +
         esc(a.desde) + ' → ' + esc(a.hasta) +
         (a.sinCerrar ? ' · <span class="alerta">⚠ semana sin cerrar, datos parciales</span>' : '') +
         '</p>';
}

/* ── Paso 2 · el temario, en UN SOLO pegado ───────────────────────────────────────────────
 *
 * ⭐ **Vuelve el formato único**, como estaba antes: la lista de reuniones + el título «Campañas
 * destacadas» + las campañas, todo en un pegado. El ruteo lo hace el backend
 * (`partirTemarioDelAsistente_`); acá no se parte nada — si el HTML lo derivara habría dos
 * definiciones de dónde termina un bloque, y **la del HTML no tiene prueba**. */
function pasoTemario(){
  var a = asis();
  var h = cabezalDelPeriodo();
  h += '<p class="hint">Pegá el temario <b>completo</b>: las reuniones, el título ' +
       '<span class="mono">&gt; Campañas destacadas</span> y las campañas debajo. Se reparte solo.</p>';
  h += '<textarea class="temario" id="asis-temario" rows="10" ' +
       'placeholder="1) JM | Uno a uno en Retiro 24/07&#10;2) JM | Encuentro Temático: Salud 25/07&#10;' +
       '&gt; Campañas destacadas&#10;1) Egreso de cadetes"></textarea>';
  h += '<div class="cuadro-btns">' +
       '<button class="btn btn-secondary" id="asis-proponer">Proponer</button>' +
       '<button class="btn btn-primary" id="asis-cargar">Cargar y seguir</button>' +
       '</div>';

  if (a.cargado) h += resumenDeCarga(a.cargado);
  h += '<hr class="sep"><button class="btn btn-secondary" id="asis-reiniciar">Empezar de nuevo</button>';
  return h;
}

/**
 * ⭐⭐ **El resumen de la carga dice CUÁLES no se pudieron interpretar, no cuántas.**
 *
 * «3 sin parsear» no deja saber cuáles, y **un temario que carga 4 de 5 y no lo dice publica un
 * informe al que le falta un encuentro**. Las líneas marcadas se ven acá y otra vez en el paso 3,
 * que es donde se decide si entran.
 */
function resumenDeCarga(r){
  var h = '<div class="alert alert-info"><div class="alert-title">Cargado</div>';
  var partes = [];
  if (r.reuniones) partes.push(r.reuniones.agregadas + ' reunión(es)');
  if (r.campanas) partes.push((r.campanas.escritas || []).length + ' campaña(s)');
  if (r.reuniones && (r.reuniones.salteadas || []).length){
    partes.push(r.reuniones.salteadas.length + ' ya estaba(n)');
  }
  h += esc(partes.join(' · ') || 'nada');
  (r.avisos || []).forEach(function(t){ h += '<br>' + esc(t); });
  h += '</div>';

  h += bloqueDeIgnoradas(r.ignoradas);

  var rotas = (r.reuniones && r.reuniones.sinParsearDetalle) || [];
  if (rotas.length){
    h += '<div class="alert alert-warning"><div class="alert-title">' + rotas.length +
         ' línea(s) que no se pudieron interpretar</div>' +
         'Entraron igual, marcadas, y las vas a ver en el paso 3 para decidir si van o no. ' +
         '<b>Ninguna se descartó en silencio.</b>';
    rotas.forEach(function(x){
      h += '<br><span class="mono">' + esc(x.texto) + '</span> — ' + esc(x.motivo);
    });
    h += '</div>';
  }
  return h;
}

/**
 * ⭐⭐ `2026-08-27_2` Parte F - **las lineas que no fueron a ninguna hoja se VEN.**
 *
 * El corte de campanias, el bloque descartado, los encabezados y los ejes agregados. **Sin
 * checkbox**: no son filas, no hay nada que confirmar - mostrarlas con un tilde diria que se
 * pueden hacer entrar, y no se puede.
 *
 * ⭐ **Y se pintan ARRIBA**, con el criterio que este panel ya usa: lo que cambia como se lee la
 * lista de abajo va arriba, no al pie. Una linea que desaparece en silencio es exactamente lo que
 * este paso vino a cerrar.
 */
function bloqueDeIgnoradas(ignoradas){
  if (!ignoradas || !ignoradas.length) return '';
  var comoDice = {
    separador: 'es la línea que corta el temario',
    encabezado: 'es un encabezado, no un ítem',
    'bloque descartado': 'está debajo de «Otros temas»',
    'eje agregado': 'es un bloque agregado de período, no un encuentro'
  };
  var h = '<div class="alert alert-info"><div class="alert-title">' + ignoradas.length +
          ' línea(s) que no fueron a ninguna hoja</div>' +
          'No son filas y no hay nada que confirmar. <b>Ninguna se descartó en silencio.</b>';
  ignoradas.forEach(function(x){
    h += '<br><span class="mono">' + esc(x.texto) + '</span> — ' +
         esc(comoDice[x.motivo] || x.motivo);
  });
  return h + '</div>';
}

/* ── Paso 3 · confirmar, en UNA sola pantalla ─────────────────────────────────────────────
 *
 * ⭐ **Dos preguntas al mismo tiempo, y viven juntas porque las dos deciden el número:** si la
 * fila entra al informe, y **contra qué cuenta ancló**. La segunda ya costó caro — el deck del
 * 04/08 publicó once números de `3347-JULJDGAG` cuando el encuentro era `3387-JULJDGGC`.
 *
 * ⛔⛔ **El anclaje corre al CONFIRMAR, no al entrar, y es una premisa corregida con medición:**
 * `leerReuniones_` filtra por `mostrar` **antes** de que el anclaje vea nada, y un temario recién
 * cargado tiene `mostrar` vacío en todas sus filas. Anclar al entrar devolvería tres listas
 * vacías, que se leen como *«ningún encuentro tiene problema»*. */
function pasoConfirmar(){
  var a = asis();
  if (a.confirmar === null || a.confirmar === undefined){ cargarPaso3(); return cabezalDelPeriodo() + '<p class="muted">Leyendo lo cargado…</p>'; }
  if (a.confirmar === 'cargando') return cabezalDelPeriodo() + '<p class="muted">Leyendo lo cargado…</p>';
  if (!a.confirmar.ok){
    return cabezalDelPeriodo() + '<p class="hint-error">' + esc(a.confirmar.motivo || '') + '</p>' +
      '<button class="btn btn-secondary" id="asis-reiniciar">Empezar de nuevo</button>';
  }

  var d = a.confirmar;
  var h = cabezalDelPeriodo();

  /* ⭐ Lo que cambia cómo se lee TODO lo de abajo va arriba, no en un pie de página. */
  h += bloqueDeIgnoradas(a.cargado && a.cargado.ignoradas);
  if (d.sin_parsear){
    h += '<div class="alert alert-warning"><div class="alert-title">' + d.sin_parsear +
         ' línea(s) que el motor no pudo interpretar</div>Están en la lista, marcadas. ' +
         '<b>Ninguna se descartó en silencio</b> — destildá las que no vayan.</div>';
  }

  h += '<p class="hint">Tildá lo que entra al informe. Al confirmar corre el anclaje y vas a ver ' +
       '<b>contra qué cuenta ancló cada encuentro</b>.</p>';

  h += filaDeConfirmacion(d.reuniones, 'Encuentros', a);
  h += filaDeConfirmacion(d.campanas, 'Campañas destacadas', a);

  h += '<div class="cuadro-btns">' +
       '<button class="btn btn-primary" id="asis-confirmar">' +
       (a.anclaje ? 'Confirmar y anclar de nuevo' : 'Confirmar y anclar') + '</button>' +
       '</div>';

  if (a.anclaje) h += bloqueDeAnclaje(a.anclaje, a.sinFila, a.canales);

  /* ⛔ **El botón del paso 4 aparece sólo cuando el BACKEND dice que puede.** `puedeGenerar` sale
   * de `guardaDelAsistente_` para el paso 4, con hechos releídos de la hoja después de escribir —
   * no de que este objeto crea que la confirmación salió bien. */
  if (a.anclaje && a.puedeGenerar){
    h += '<div class="cuadro-btns"><button class="btn btn-primary" id="asis-al-4">' +
         'Seguir al paso 4 — generar</button></div>';
  } else if (a.anclaje){
    h += '<p class="hint-error">Todavía no se puede generar: quedó alguna reunión sin decidir.</p>';
  }

  h += '<hr class="sep"><button class="btn btn-secondary" id="asis-reiniciar">Empezar de nuevo</button>';
  return h;
}

/** Una lista de checks. `sin_decidir` y `sin_parsear` se pintan distinto: son cosas distintas. */
function filaDeConfirmacion(filas, titulo, a){
  if (!filas || !filas.length) return '';
  var h = '<div class="cuadro"><div class="cuadro-tit">' + esc(titulo) + ' (' + filas.length + ')</div>';
  filas.forEach(function(f){
    /* El estado inicial del check sale de la hoja, no de un default del front: una fila ya
     * decidida tiene que verse como está, y `mostrar` vacío arranca tildado porque el temario es
     * lo que entra (`R-02`) y destildar es la excepción. */
    var tildado = a.checks && (f.clave in a.checks) ? a.checks[f.clave]
                : (f.sin_decidir ? !f.sin_parsear : f.mostrar);
    h += '<label class="check"><input type="checkbox" data-asis-check="' + esc(f.clave) +
         '" data-asis-fuente="' + esc(f.fuente) + '"' + (tildado ? ' checked' : '') + '>' +
         '<span class="check-text"><span class="check-label">' + esc(f.etiqueta) +
         (f.fecha ? ' <span class="mono">' + esc(f.fecha) + '</span>' : '') + '</span>';
    var sub = [];
    if (f.detalle) sub.push(f.detalle);
    if (f.etapa) sub.push(f.etapa);
    if (f.sin_parsear) sub.push('⚠ ' + (f.notas || 'no se pudo interpretar'));
    else if (f.notas) sub.push(f.notas);
    if (sub.length) h += '<span class="check-sub">' + esc(sub.join(' · ')) + '</span>';
    h += '</span></label>';
  });
  return h + '</div>';
}

/**
 * ⭐⭐ **Los tres estados del anclaje, y los tres se ven.**
 *
 * ⛔ Esta pantalla lee el **resultado** de `anclarEncuentros`, no `ANCLAJE_PENDIENTE`: esa hoja
 * sólo registra los de baja confianza, así que un encuentro que ancló perfecto y uno que no ancló
 * contra nada **se ven idénticos desde ahí — no están**.
 */
function bloqueDeAnclaje(an, sinFila, meta){
  if (!an || !an.ok){
    return '<div class="alert alert-warning"><div class="alert-title">El anclaje no pudo correr</div>' +
      esc((an && an.motivo) || '') + '</div>';
  }
  var h = '<hr class="sep"><div class="section-title">Contra qué cuenta ancló cada encuentro</div>';
  h += '<p class="hint">' + an.conteos.alta + ' con anclaje firme · ' + an.conteos.baja +
       ' de baja confianza · ' + an.conteos.sin_link + ' sin cuenta. Umbral: ' +
       esc(String(an.umbral)) + '.</p>';

  if ((sinFila || []).length){
    h += '<p class="hint-error">⛔ ' + (sinFila.length + ' decisión(es) no se pudieron escribir: ') +
         esc(sinFila.join(' · ')) + '. La lista que tenías en pantalla estaba vieja — volvé a entrar.</p>';
  }

  var glifo = { alta: '✅', baja: '⚠', sin_link: '⛔' };
  an.filas.forEach(function(f){
    h += '<div class="cuadro">';
    h += '<div class="cuadro-tit">' + esc(glifo[f.estado] || '·') + ' ' + esc(f.reunion) +
         (f.fecha ? ' <span class="mono">' + esc(f.fecha) + '</span>' : '') + '</div>';
    if (f.estado === 'alta'){
      h += '<div class="cuadro-est">Ancló contra <span class="mono">' + esc(f.id_cuenta) + '</span>' +
           (f.candidato ? ' — ' + esc(f.candidato) : '') +
           (f.score !== null ? ' · puntaje ' + esc(String(f.score)) : '') +
           (f.confirmado_a_mano ? ' · <b>confirmado a mano</b>' : '') + '</div>';
    } else if (f.estado === 'baja'){
      h += '<div class="cuadro-est"><span class="alerta">Ancló por debajo del umbral</span> contra ' +
           '<span class="mono">' + esc(f.id_cuenta) + '</span>' +
           (f.score !== null ? ' · puntaje ' + esc(String(f.score)) + ' contra ' + esc(String(an.umbral)) : '') +
           '</div>';
      h += '<div class="cuadro-est">Elegí la cuenta en la pestaña <b>Anclajes</b>: ahí están los tres ' +
           'candidatos con su puntaje, y lo que elijas queda guardado para que no se vuelva a ' +
           'preguntar.</div>';
    } else {
      h += '<div class="cuadro-est"><span class="alerta">Sin cuenta</span> — ' +
           esc(f.motivo || 'no se pudo anclar') + '</div>';
      if (f.traza_desempate) h += '<div class="cuadro-est mono">' + esc(f.traza_desempate) + '</div>';
      /* ⛔ **Se DICE por qué no hay botón, en vez de ofrecer uno que falla.** El motor sólo escribe
       * fila en `ANCLAJE_PENDIENTE` cuando el score queda bajo el umbral, así que un `sin link` no
       * tiene fila donde guardar la elección — y `panel_confirmarAnclaje` no inventa filas. */
      h += '<div class="cuadro-est">⛔ Este no se puede elegir desde el panel: el motor sólo deja ' +
           'fila en <span class="mono">ANCLAJE_PENDIENTE</span> cuando el anclaje queda por debajo ' +
           'del umbral, y éste no llegó a ese punto. Sale sin cuenta, con el hueco a la vista.</div>';
    }
    /* ⭐⭐ `2026-08-28` — **primero el id, después los canales.** Con la cuenta ya resuelta, lo que
     * hace falta saber es si esa cuenta EXISTE en cada canal: sin contraparte en `Directa Mail` no
     * va a haber mails, sin contraparte en el desglose no va a haber impresiones. Hoy eso se
     * descubre mirando el deck vacío, que es dos pasos tarde. */
    h += canalesHTML(f.canales);
    h += '</div>';
  });

  /* ⚠ **Qué se consultó, dicho siempre.** Sin esta línea, un canal que no aparece se lee como
   * «no hay filas» cuando puede ser «no se pudo mirar» — la distinción de siempre. Los canales
   * son las solapas que declaran `campo_id_cuenta`: si falta uno que esperabas, lo que falta es
   * esa celda en `SOLAPAS`, no el dato. */
  if ((an.filas || []).length && ((meta||{}).consultados || []).length){
    h += '<p class="hint">Canales consultados (' + meta.consultados.length + '): ' +
         esc(meta.consultados.join(' · ')) + '. Se mira si la cuenta <b>existe</b> en cada uno, ' +
         'sin recortar por la ventana — una fila fuera de la semana existe y no publica.</p>';
  }
  if (((meta||{}).fallidos || []).length){
    h += '<p class="hint-error">⛔ ' + meta.fallidos.length + ' canal(es) no se pudieron ' +
         'consultar: ' + esc(meta.fallidos.join(' · ')) + '</p>';
  }
  return h;
}

/**
 * ⭐ Los canales de una cuenta: ✅ con filas, ⛔ sin ninguna.
 *
 * ⚠ **Cero filas NO es un error y no se pinta como tal**: quiere decir que esa cuenta no tiene
 * nada en ese canal, que para un encuentro sin mail es lo correcto y esperable. Lo que el glifo
 * dice es *«acá no va a salir nada»*, y eso es útil ANTES de generar.
 */
function canalesHTML(cs){
  if (!cs || !cs.length) return '';
  return '<div class="cuadro-est">' + cs.map(function(c){
    return (c.filas > 0 ? '✅ ' : '⛔ ') + esc(c.solapa) +
           (c.filas > 0 ? ' <span class="mono">' + c.filas + '</span>' : '');
  }).join(' · ') + '</div>';
}

/* ── Paso 4 · generar ─────────────────────────────────────────────────────────────────────
 *
 * ⭐ **El período va SIEMPRE explícito**, y eso arregla un caso medido: `anclarEncuentros` recorta
 * `REUNIONES` **sólo si la ventana vino por `periodo_ref`**, así que una corrida sin período
 * elegido da **la misma ventana de fechas y otro temario** — 12 encuentros en vez de 2. */
function pasoGenerar(){
  var a = asis();
  var inf = informeActual();
  var h = cabezalDelPeriodo();

  h += '<p class="hint">Todo lo de arriba está confirmado. Esto genera el deck ' +
       '<b>sobre este período</b> — nunca «por defecto».</p>';

  h += '<div class="field"><label for="asis-informe">Informe</label>' +
       '<select id="asis-informe">' +
       S.informes.map(function(i){
         return '<option value="' + esc(i.id) + '"' + (i.id===S.informeId?' selected':'') + '>' +
           esc(i.nombre) + '</option>';
       }).join('') + '</select>';
  if (inf && inf.marcadores_cableados === 0){
    h += '<p class="hint">Este informe todavía no tiene datos configurados: el deck va a salir ' +
         'con huecos en casi todos los lugares.</p>';
  }
  h += '</div>';

  if (inf && (inf.secciones||[]).length){
    h += '<div class="field"><span class="section-title">Secciones repetibles</span>';
    h += (inf.secciones||[]).map(function(s){
      return '<label class="check"><input type="checkbox" data-seccion="' + esc(s.id) + '"' +
        (S.secciones[s.id]?' checked':'') + '>' +
        '<span class="check-text"><span class="check-label">' + esc(s.id) + '</span>' +
        (s.itera_sobre ? '<span class="check-sub">itera sobre ' + esc(s.itera_sobre) + '</span>' : '') +
        '</span></label>';
    }).join('');
    h += '<p class="hint">Sacar una acorta la corrida — el techo es de ' + TECHO_S + ' s.</p></div>';
  }

  h += '<label class="check"><input type="checkbox" id="asis-raya"' + (S.conSimbolos?' checked':'') + '>' +
       '<span class="check-text"><span class="check-label">Los huecos se ven como símbolos</span>' +
       '<span class="check-sub">/////&nbsp;falta cablearlo · »»»&nbsp;no se llegó · ---&nbsp;falló · -&nbsp;sin dato.</span></span></label>';

  h += '<div class="field">' +
       '<button class="btn btn-primary" id="asis-generar">Generar informe</button>' +
       '<button class="btn btn-secondary" id="asis-generar-des">Generar y que siga sola</button>' +
       '<p class="hint"><b>Generar informe</b> corre de una vez y devuelve el deck: es lo más ' +
       'rápido cuando entra en el techo de ' + TECHO_S + ' s. <b>Generar y que siga sola</b> deja ' +
       'la corrida reanudándose por su cuenta, y el avance se mira en la pestaña «Corrida».</p>' +
       '</div>';

  h += '<hr class="sep"><button class="btn btn-secondary" id="asis-reiniciar">Empezar de nuevo</button>';
  return h;
}

/**
 * Arranca la generación desde el asistente.
 *
 * ⭐ **Reusa el estado y las vistas del camino libre** —`S.estado`, `vistaEsperando`, `vistaListo`,
 * `vistaFallo`— en vez de duplicar la pantalla de resultado, que es la más larga del panel. Lo
 * único propio es **por dónde entra**: `panel_asistenteGenerar`, que corre la guarda del paso 4 y
 * manda el período **siempre explícito**.
 */
function generarDesdeAsistente(desatendida){
  var a = asis();
  S.periodoId = a.periodoId;   // el selector del camino libre queda coherente con lo elegido acá
  S.estado = 'generando';
  S.elapsed = 0;
  S.resultado = null;
  S.motivo = null;
  S.tab = 'generar';           // la espera y el resultado se pintan con las vistas de siempre
  pintar();
  S.tick = setInterval(function(){ S.elapsed++; pintarTimer(); }, 1000);

  var elegidas = [];
  Object.keys(S.secciones).forEach(function(k){ if (S.secciones[k]) elegidas.push(k); });

  google.script.run
    .withSuccessHandler(function(r){
      clearInterval(S.tick); S.tick = null;
      if (!r || !r.ok){ S.estado = 'fallo'; S.motivo = (r && r.motivo) || 'Sin motivo.'; pintar(); return; }
      if (desatendida){
        S.estado = 'form'; S.desArranque = r; S.des = null; S.tab = 'desatendida'; pintar(); return;
      }
      S.estado = 'listo'; S.resultado = r; pintar(); cargarCorridas();
    })
    .withFailureHandler(function(e){
      clearInterval(S.tick); S.tick = null;
      S.estado = 'fallo'; S.motivo = (e && e.message) || String(e); pintar();
    })
    .panel_asistenteGenerar(S.informeId, a.periodoId, S.conSimbolos, elegidas, desatendida === true);
}

function cargarPaso3(){
  var a = asis();
  a.confirmar = 'cargando';
  google.script.run
    .withSuccessHandler(function(r){ asis().confirmar = r || {ok:false, motivo:'sin respuesta'}; pintar(); })
    .withFailureHandler(function(e){ asis().confirmar = {ok:false, motivo:String(e && e.message || e)}; pintar(); })
    .panel_asistentePaso3(a.periodoId, S.informeId);
}

function confirmarYAnclar(){
  var a = asis();
  var decisiones = [];
  Array.prototype.forEach.call(document.querySelectorAll('[data-asis-check]'), function(cb){
    decisiones.push({
      fuente: cb.getAttribute('data-asis-fuente'),
      clave: cb.getAttribute('data-asis-check'),
      mostrar: cb.checked
    });
  });
  /* Los checks se guardan en el estado para que el repintado no los pierda mientras se ancla. */
  a.checks = {};
  decisiones.forEach(function(d){ a.checks[d.clave] = d.mostrar; });

  a.msg = { ok:true, texto:'Escribiendo la confirmación y anclando… puede tardar.' };
  pintar();
  google.script.run
    .withSuccessHandler(function(r){
      var a2 = asis();
      if (!r || !r.ok){
        a2.msg = { ok:false, texto:(r && r.motivo) || 'No se pudo confirmar.' };
        pintar(); return;
      }
      a2.msg = null;
      a2.anclaje = r.anclaje;
      a2.sinFila = r.sin_fila || [];
      a2.canales = { consultados: r.canales_consultados || [], fallidos: r.canales_fallidos || [] };
      a2.puedeGenerar = r.puede_generar === true;
      /* ⛔ **No se salta solo al paso 4.** El anclaje es lo que la persona vino a mirar acá: pasar
       * de largo dejaría la segunda pregunta del paso 3 sin contestar. */
      pintar();
    })
    .withFailureHandler(function(e){
      asis().msg = { ok:false, texto:String(e && e.message || e) };
      pintar();
    })
    .panel_asistenteConfirmar(a.periodoId, S.informeId, decisiones);
}

/**
 * **Proponer** reusa `panel_proponerTemario`, que ya existe y **sólo lee**.
 *
 * ⚠ Se piden las DOS fuentes y se pegan en un solo texto, porque el paso 2 es un pegado único.
 * ⭐ El de campañas ya viene con su título `> Campañas destacadas`: sin ese encabezado el cargador
 * no encuentra el bloque, así que el orden —reuniones primero, campañas después— no es estético.
 */
function proponerTemarioDelAsistente(){
  var a = asis();
  a.msg = { ok:true, texto:'Proponiendo…' };
  pintar();
  google.script.run
    .withSuccessHandler(function(reu){
      google.script.run
        .withSuccessHandler(function(cam){
          var partes = [];
          if (reu && reu.ok && reu.texto) partes.push(reu.texto);
          if (cam && cam.ok && cam.texto) partes.push(cam.texto);
          var ta = el('asis-temario');
          var texto = partes.join('\n');
          if (ta) ta.value = texto;
          var dichos = [];
          if (reu && reu.ok) dichos.push(reu.propuestas + ' línea(s) de reuniones');
          else if (reu) dichos.push('reuniones: ' + (reu.motivo || reu.motivo_vacio || 'nada'));
          if (cam && cam.ok) dichos.push(cam.propuestas + ' campaña(s)');
          else if (cam) dichos.push('campañas: ' + (cam.motivo || cam.motivo_vacio || 'nada'));
          asis().msg = { ok:true, texto: dichos.join(' · ') + ' — revisalas y apretá Cargar.' };
          pintar();
          var ta2 = el('asis-temario');
          if (ta2) ta2.value = texto;
        })
        .withFailureHandler(function(e){ asis().msg = {ok:false, texto:String(e && e.message || e)}; pintar(); })
        .panel_proponerTemario('CAMPANAS', a.periodoId);
    })
    .withFailureHandler(function(e){ asis().msg = {ok:false, texto:String(e && e.message || e)}; pintar(); })
    .panel_proponerTemario('REUNIONES', a.periodoId);
}

function cargarTemarioDelAsistente(){
  var a = asis();
  var ta = el('asis-temario');
  var texto = ta ? ta.value : '';
  a.msg = { ok:true, texto:'Cargando…' };
  pintar();
  google.script.run
    .withSuccessHandler(function(r){
      var a2 = asis();
      if (!r || !r.ok){
        a2.msg = { ok:false, texto: (r && r.motivo) || 'No se pudo cargar.' };
        pintar(); return;
      }
      a2.cargado = r;
      a2.msg = null;
      /* ⛔ **El paso lo habilita el BACKEND, no el front.** `puede_confirmar` lo decide
       * `guardaDelAsistente_` para el paso 3, con hechos leídos de la hoja **después** de
       * escribir — no con lo que este objeto crea que pasó. */
      if (r.puede_confirmar) a2.paso = 3;
      else a2.msg = { ok:false, texto:'Se cargó, pero no quedó ninguna fila de temario para este ' +
        'período: sin filas el paso 3 no tiene qué confirmar.' };
      pintar();
    })
    .withFailureHandler(function(e){
      asis().msg = { ok:false, texto:String(e && e.message || e) };
      pintar();
    })
    .panel_asistenteCargarTemario(a.periodoId, texto, S.informeId);
}

function cargarOpcionesDePeriodo(){
  asis().opciones = 'cargando';
  google.script.run
    .withSuccessHandler(function(r){ asis().opciones = r || {ok:false, motivo:'sin respuesta'}; pintar(); })
    .withFailureHandler(function(e){ asis().opciones = {ok:false, motivo:String(e && e.message || e)}; pintar(); })
    .panel_asistenteOpcionesDePeriodo();
}

/**
 * ⭐ El resultado del paso 1 en una frase, y **dice si CREÓ o si REUSÓ**.
 *
 * No es prolijidad: «creé» y «ya estaba» mandan a lecturas distintas, y colapsarlos es
 * exactamente cómo una corrida que no hizo nada se lee como éxito (`CLAUDE.md` §4).
 */
function mensajeDelPaso1(r){
  if (!r || !r.ok) return { ok:false, texto: (r && r.motivo) || 'sin motivo' };
  var partes = [];
  partes.push(r.reusado ? 'Se reusó ' + r.periodo_id + ' — ya estaba y no se tocó'
                        : 'Se creó ' + r.periodo_id);
  partes.push('Filas en PERIODOS: ' + r.filas_antes + ' → ' + r.filas_despues);
  (r.avisos || []).forEach(function(t){ partes.push(t); });
  if ((r.claves_repetidas || []).length){
    partes.push('⛔ PERIODOS tiene claves repetidas: ' + r.claves_repetidas.join(', '));
  }
  return { ok:true, texto: partes.join(' · ') };
}

function elegirPeriodoDelAsistente(modo, desde, hasta){
  var a = asis();
  a.trabajando = true;
  a.msg = { ok:true, texto:'Resolviendo el período…' };
  pintar();
  google.script.run
    .withSuccessHandler(function(r){
      var a2 = asis();
      a2.trabajando = false;
      a2.msg = mensajeDelPaso1(r);
      if (r && r.ok){
        a2.modo = r.modo; a2.periodoId = r.periodo_id;
        a2.desde = r.desde; a2.hasta = r.hasta; a2.sinCerrar = r.sin_cerrar === true;
        a2.paso = 2;
        /* El selector de la pestaña «Generar» tiene que ver la fila nueva sin recargar el panel. */
        recargarPeriodos();
        return;
      }
      pintar();
    })
    .withFailureHandler(function(e){
      var a2 = asis();
      a2.trabajando = false;
      a2.msg = { ok:false, texto:String(e && e.message || e) };
      pintar();
    })
    .panel_asistenteCrearPeriodo(modo, desde || '', hasta || '');
}

function conectarAsistente(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-asis-per]'), function(b){
    b.onclick = function(){ elegirPeriodoDelAsistente(b.getAttribute('data-asis-per'), '', ''); };
  });
  var bc = el('asis-per-custom');
  if (bc) bc.onclick = function(){
    var d = el('asis-desde'), ha = el('asis-hasta');
    if (!d || !ha || !d.value || !ha.value){
      asis().msg = { ok:false, texto:'Faltan las dos fechas.' };
      pintar();
      return;
    }
    elegirPeriodoDelAsistente('personalizado', d.value, ha.value);
  };
  var bp = el('asis-proponer');
  if (bp) bp.onclick = proponerTemarioDelAsistente;
  var bt = el('asis-cargar');
  if (bt) bt.onclick = cargarTemarioDelAsistente;
  var bcf = el('asis-confirmar');
  if (bcf) bcf.onclick = confirmarYAnclar;
  var b4 = el('asis-al-4');
  if (b4) b4.onclick = function(){ asis().paso = 4; pintar(); };
  var ai = el('asis-informe');
  if (ai) ai.onchange = function(){ S.informeId = ai.value; resetSecciones(); pintar(); };
  var ar = el('asis-raya');
  if (ar) ar.onchange = function(){ S.conSimbolos = ar.checked; };
  /* Las secciones usan el mismo atributo que el camino libre, así que se conectan igual: el
   * estado es uno solo y no hay dos definiciones de qué está tildado. */
  Array.prototype.forEach.call(document.querySelectorAll('[data-seccion]'), function(cb){
    cb.onchange = function(){ S.secciones[cb.getAttribute('data-seccion')] = cb.checked; };
  });
  var bg = el('asis-generar');
  if (bg) bg.onclick = function(){ generarDesdeAsistente(false); };
  var bgd = el('asis-generar-des');
  if (bgd) bgd.onclick = function(){ generarDesdeAsistente(true); };
  var br = el('asis-reiniciar');
  if (br) br.onclick = reiniciarAsistente;
}

function vistaGenerar(){
  if (S.estado === 'generando') return vistaEsperando();
  if (S.estado === 'listo')     return vistaListo();
  if (S.estado === 'fallo')     return vistaFallo();

  var inf = informeActual();
  var previa = corridaPrevia();
  var h = '';

  h += '<div class="field"><label for="f-informe">Informe</label>' +
       '<select id="f-informe">' +
       S.informes.map(function(i){
         return '<option value="' + esc(i.id) + '"' + (i.id===S.informeId?' selected':'') + '>' +
           esc(i.nombre) + '</option>';
       }).join('') +
       (FLAGS.personalizado ? '<option value="__custom">Informe semanal personalizado</option>' : '') +
       '</select>';
  if (inf && inf.marcadores_cableados === 0){
    h += '<p class="hint">Este informe todavía no tiene datos configurados: el deck va a salir ' +
         'con huecos en casi todos los lugares.</p>';
  }
  h += '</div>';

  h += '<div class="field"><label for="f-periodo">Período</label>' +
       '<select id="f-periodo"><option value="">' +
       (S.porDefecto && S.porDefecto.ok ? esc(S.porDefecto.etiqueta) + ' (por defecto)' : 'Por defecto') +
       '</option>' +
       S.periodos.map(function(p){
         return '<option value="' + esc(p.id) + '"' + (p.id===S.periodoId?' selected':'') + '>' +
           esc(p.id) + ' · ' + esc(p.desde) + ' → ' + esc(p.hasta) + '</option>';
       }).join('') +
       '</select>' +
       (S.porDefecto && S.porDefecto.ok
         ? '<p class="hint">Si no elegís, sale ' + esc(S.porDefecto.etiqueta) +
           '. Podés cambiarlo en la lista.</p>'
         : '<p class="hint">Elegí el período del informe.</p>');

  /* `2026-08-20_2` Parte B — lo que le falta a la propuesta para ser confiable, ANTES de que la
   * persona espere cinco minutos. Sólo se pinta cuando el selector está en "por defecto": si
   * eligió un período de la lista, el recorte se aplica y no hay nada que avisar. */
  var avisosVentana = (!S.periodoId && S.porDefecto && S.porDefecto.ok && S.porDefecto.avisos) || [];
  /* ⭐ `2026-08-26_2` Parte C — **el `nivel` se respeta.** Acá todo se pintaba `hint-error`,
   * así que el caso normal —ventana calculada **con** fila en `PERIODOS`, que ahora informa que
   * el recorte SÍ se aplica— saldría en rojo. **Un aviso que aparece siempre deja de leerse**,
   * y eso ya está escrito en el propio `PanelBackend.gs` desde que se redactó este aviso por
   * primera vez. */
  avisosVentana.forEach(function(a){
    h += '<p class="' + (a.nivel === 'info' ? 'hint' : 'hint-error') + '">' + esc(a.texto) + '</p>';
  });
  /* ⭐ `2026-08-26_2` Parte F — los dos botones para crear el período que falta.
   * Va **después** del selector: primero se mira si ya está, y recién si no está se crea. */
  if (S.previaSemana === null) cargarPreviaSemana();
  h += bloqueCrearPeriodo();

  var roto = S.periodos.filter(function(p){
    return String(p.desde).indexOf('ilegible') !== -1 || String(p.hasta).indexOf('ilegible') !== -1;
  });
  if (roto.length){
    h += '<p class="hint-error">Fecha sin cargar bien — los demás períodos funcionan igual.</p>';
  }
  h += '</div>';

  /* Sin período por defecto NO se ofrece el botón: fallaría recién a los cinco minutos.
   * Elegir uno explícito de la lista lo devuelve. */
  var sinDefecto = S.porDefecto && S.porDefecto.ok === false && !S.periodoId;
  if (sinDefecto){
    h += '<div class="alert alert-warning"><div class="alert-title">No se resolvió el período por defecto.</div>' +
         esc(S.porDefecto.motivo || '') + '</div>';
  }

  /* La vía rápida: si este informe ya tiene un deck cerrado **de este período**, se ofrece
   * abrirlo antes que volver a esperar cinco minutos. La fecha y hora quedan a la vista: es lo
   * único que distingue dos decks del mismo informe y el mismo período. */
  if (previa && !S.forzarForm){
    h += '<hr class="sep">';
    h += '<p class="hint">Ya hay un deck generado para este período: se abre al instante.</p>';
    h += deckCard(previa.deck_id, (inf && inf.nombre) || previa.informe_id,
      'Generado el ' + esc(previa.fecha_generacion));
    h += '<button class="btn btn-secondary" id="b-denuevo">Generar de nuevo, a sabiendas</button>';
    return h;
  }

  if (previa && S.forzarForm){
    h += '<div class="alert alert-warning">Ya existe un deck de este período. Esto genera otro y ' +
         'tarda entre 120 y 320 s igual.</div>';
  }

  if (inf && (inf.secciones||[]).length){
    h += '<hr class="sep">';
    h += '<div class="field"><span class="section-title">Secciones repetibles</span>';
    h += (inf.secciones||[]).map(function(s){
      return '<label class="check"><input type="checkbox" data-seccion="' + esc(s.id) + '"' +
        (S.secciones[s.id]?' checked':'') + '>' +
        '<span class="check-text"><span class="check-label">' + esc(s.id) + '</span>' +
        (s.itera_sobre ? '<span class="check-sub">itera sobre ' + esc(s.itera_sobre) + '</span>' : '') +
        '</span></label>';
    }).join('');
    /* El techo lo dice el backend. Decía `350` escrito a mano, que es exactamente lo que el
     * `2026-08-21_1` sacó de la regla del cronómetro tres bloques más abajo: **un techo declarado
     * en dos lugares es un techo que puede mentir en uno de los dos.** */
    h += '<p class="hint">Sacar una acorta la corrida — el techo es de ' + TECHO_S + ' s.</p></div>';
  }

  /* `2026-08-19_2` — los cuadrados van DESPUÉS del selector de período y ANTES del botón de
   * generar: el orden de la pantalla es el orden del proceso (`docs/PROCESO_SEMANAL.md`). */
  h += pintarCuadrados();

  h += '<label class="check"><input type="checkbox" id="f-raya"' + (S.conSimbolos?' checked':'') + '>' +
       '<span class="check-text"><span class="check-label">Los huecos se ven como símbolos</span>' +
       '<span class="check-sub">/////&nbsp;falta cablearlo · »»»&nbsp;no se llegó · ---&nbsp;falló · -&nbsp;sin dato. ' +
       'Destildado sale «FALTA:token», que dice cuál es.</span></span></label>';

  /* ⭐ `2026-08-21_19` Parte A — **dos botones, y la pantalla dice cuál conviene.**
   *
   * ⚠ **El botón viejo NO se retira, y el motivo es de costo medido:** el arranque —anclaje más
   * unión digital— cuesta **70-80 s por ejecución**, así que una corrida que entra en una sola
   * es más barata que la misma partida en tres, que pagarían ese arranque tres veces. Mientras el
   * desatendido no esté probado punta a punta, sacarle a la persona la única forma que funciona
   * hoy sería un cambio en la dirección equivocada.
   *
   * **El rótulo dice qué pasa, no cómo se llama el mecanismo.** «Se reanuda sola» es lo que le
   * importa a quien aprieta; «desatendida» es vocabulario nuestro. */
  if (!sinDefecto){
    h += '<div class="field">';
    h += '<button class="btn btn-primary" id="b-generar">Generar informe</button>';
    h += '<button class="btn btn-secondary" id="b-generar-des">Generar y que siga sola</button>';
    h += '<p class="hint"><b>Generar informe</b> corre de una vez y devuelve el deck acá: es lo ' +
         'más rápido cuando entra en el techo de ' + TECHO_S + ' s. ' +
         '<b>Generar y que siga sola</b> deja la corrida reanudándose por su cuenta hasta ' +
         'terminar, y el avance se mira en la pestaña «Corrida». Conviene cuando la semana trae ' +
         'muchos encuentros y la corrida de una sola vez viene cortando.</p>';
    h += '</div>';
  }
  return h;
}

    refrescarEstado();
