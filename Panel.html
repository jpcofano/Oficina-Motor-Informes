function vistaEsperando(){
  return '<div id="timer">' + timerHtml() + '</div>' +
    '<p class="hint">Una corrida completa tarda entre 120 y 320 s: copia la plantilla, expande las ' +
    'secciones y resuelve cada marcador.</p>' +
    '<hr class="sep">' +
    '<p class="hint">Si se cierra esta ventana la corrida sigue en el servidor. Al volver a abrir el ' +
    'panel, va a aparecer en «Corridas» cuando termine.</p>';
}

function timerHtml(){
  var pct = Math.min(100, (S.elapsed / TECHO_S) * 100);
  var clase = S.elapsed > (TECHO_S - 30) ? ' is-danger' : (S.elapsed > RANGO_S[1] ? ' is-warn' : '');
  /* La banda del rango habitual se recorta contra el techo vigente. Con el techo en 150 s la
   * banda 120–320 se salía de la regla y dibujaba un «rango habitual» que no entra en el techo,
   * que es exactamente lo contrario de lo que la banda quiere decir. */
  var bandaL = Math.min(100, (RANGO_S[0] / TECHO_S) * 100);
  var bandaW = Math.max(0, Math.min(100 - bandaL, ((RANGO_S[1] - RANGO_S[0]) / TECHO_S) * 100));
  var etapa = S.elapsed < 30 ? 'copiando la plantilla'
            : (S.elapsed < 90 ? 'expandiendo secciones' : 'resolviendo marcadores');
  return '<div class="timer-top"><span class="timer-secs">' + S.elapsed + ' s</span>' +
    '<span class="timer-stage">' + esc(etapa) + '</span></div>' +
    '<div class="rule">' +
      '<div class="rule-band" style="left:' + bandaL + '%;width:' + bandaW + '%"></div>' +
      '<div class="rule-mark' + clase + '" style="left:' + pct + '%"></div>' +
    '</div>' +
    '<div class="rule-scale"><span>0 s</span><span>rango habitual ' + RANGO_S[0] + '–' + RANGO_S[1] +
      ' s</span><span>techo ' + TECHO_S + ' s · muro ' + MURO_S + ' s</span></div>';
}
function pintarTimer(){ var t = el('timer'); if (t) t.innerHTML = timerHtml(); }

/* ⭐ `2026-08-21_19` Parte D — **el `[object Object]` del href, y dónde estaba de verdad.**
 *
 * El `_15` Parte D arregló el rótulo y dejó el enlace apuntando a
 * `.../presentation/d/[object Object]/edit`. El comentario que quedó en `PanelBackend.gs` decía
 * que `deck` viajaba como objeto *"a propósito, porque el front lo desarma en `deckCard`"*, y
 * **medirlo antes de elegir el lado mostró que era falso**: `deckCard` trataba su primer
 * argumento como **id**, y de sus dos llamadores uno le pasaba un id (`previa.deck_id`, la vía
 * rápida — andaba) y el otro el objeto entero (`r.deck`, la pantalla de listo — no andaba).
 * **Nadie desarmaba nada.** Es la familia de `CLAUDE.md` §4: un comentario que afirma un contrato
 * es una premisa sin testigo, y encima mandaba al lector al archivo equivocado.
 *
 * ⭐ **El arreglo va acá, y acepta las dos formas** — un id o el `{id, url, nombre}` que emite el
 * motor —, porque los dos llamadores son legítimos y ninguno tiene por qué conocer la forma del
 * otro. Con el objeto usa **su `url`**, que es la que emitió `generarInforme`, no una
 * reconstruida.
 *
 * ⚠ **Y si no hay id, la tarjeta NO se dibuja como enlace.** Un `<a>` a
 * `/presentation/d//edit` es un enlace que parece bueno y lleva a un error de Drive; una tarjeta
 * sin enlace que dice *"el deck no viajó"* manda al trabajo correcto. **Un enlace roto y uno
 * ausente no son lo mismo**, y el que miente es el roto. */
function deckCard(deck, nombre, meta){
  var id  = (deck && typeof deck === 'object') ? String(deck.id || '') : String(deck || '');
  var url = (deck && typeof deck === 'object' && deck.url) ? String(deck.url) : '';
  if (!id && !url){
    return '<div class="deck">' +
      '<div class="deck-name">' + esc(nombre) + '</div>' +
      '<div class="deck-meta">' + meta + '</div>' +
      '<div class="deck-meta">⚠ el identificador del deck no llegó al panel — la corrida puede ' +
      'haber salido bien igual; buscalo en «Corridas».</div></div>';
  }
  return '<a class="deck" target="_blank" rel="noopener" ' +
    'href="' + esc(url || ('https://docs.google.com/presentation/d/' + id + '/edit')) + '">' +
    '<div class="deck-name">' + esc(nombre) + '</div>' +
    '<div class="deck-meta">' + meta + '</div></a>';
}

/* ═══════════════════════════════════════════════════════════════════════════════════════
 * `2026-08-23_1` Parte E — el veredicto de publicación y la leyenda
 *
 * ⭐ **Quién usa esto y para qué manda sobre cualquier decisión estética:** una persona que acaba
 * de generar un deck y necesita saber, **en diez segundos, si puede publicarlo**. No es un tablero
 * de monitoreo ni una herramienta de análisis.
 *
 * ⚠ **Lo que hay que destacar NO es la cantidad de faltantes.** Un deck con cien `/////` es normal
 * y publicable: los huecos están marcados y quien lo mira los ve. Lo que frena la publicación es
 * **que algo haya salido mal en silencio** — un número viejo publicado sin marca es peor que
 * cualquier `/////`.
 *
 * ⛔ **Y el front NO contesta por su cuenta ninguna pregunta del backend** —la regla del 20/08 que
 * retiró el `|| S.faltantesComoRaya`—. Acá no se inventa ningún hecho: se **componen** los que el
 * backend ya mandó (`corte`, `fallo`, `instrumento`, `presupuesto.barrida.por_causa`) y **cada
 * línea nombra el suyo**. Si el backend no manda el campo, la línea no aparece; no se deduce.
 * ═══════════════════════════════════════════════════════════════════════════════════════ */

/**
 * ¿Se puede publicar este deck? Devuelve el HTML del veredicto, o `''` si no hay nada que decir.
 *
 * **Tres niveles y no dos**, porque «no está completo» y «salió mal» mandan a cosas distintas:
 * a **correr de nuevo** y a **arreglar algo**. Un cartel único los confundiría, que es la misma
 * familia del `/////` que no distinguía «nadie lo cableó» de «no se llegó».
 */
function veredictoDePublicacion(r){
  var frenos = [];   // el deck no está completo, o algo salió mal
  var reparos = [];  // se puede publicar, pero hay que saber esto

  if (r.corte){
    frenos.push(r.corte.clase === 'arranque_no_entra'
      ? 'El arranque no entra en el techo: la corrida no llegó a empezar el trabajo. Correr de nuevo da lo mismo — hay que subir el techo o partir el arranque.'
      : 'La corrida se cortó por presupuesto: faltan láminas por llenar. Correr de nuevo, no cablear.');
  }
  if (r.fallo){
    frenos.push('La corrida murió por una excepción en la etapa "' + (r.fallo.etapa || '?') +
      '". No es corte por tiempo, y correr de nuevo sin arreglarlo da lo mismo.');
  }

  /* ⛔ Lo que hasta hoy no se veía en ningún lado: un token que **resolvió con valor** y salió
   * crudo igual. En el deck su hueco se ve idéntico a cualquier otro, y no entra a `FALTANTES`
   * por el camino normal. Viene de `presupuesto.barrida.por_causa`, que lo emite la Parte C. */
  var causas = (r.presupuesto && r.presupuesto.barrida && r.presupuesto.barrida.por_causa) || {};
  if (!r.corte && !r.fallo){
    if (causas.escritor){
      frenos.push(causas.escritor.cuantos + ' dato(s) se calcularon bien y NO llegaron al deck. ' +
        'Es un bug del escritor, no del cableado: ' + causas.escritor.tokens.join(', ') + '.');
    }
    if (causas.sin_clasificar){
      frenos.push(causas.sin_clasificar.cuantos + ' dato(s) quedaron crudos y el motor no pudo ' +
        'decir por qué. Mirar FALTANTES antes de publicar.');
    }
    if (causas.no_alcanzado){
      reparos.push(causas.no_alcanzado.cuantos + ' dato(s) están cableados y la corrida no los miró ' +
        '(¿lámina escondida? ¿bloque sin expandir?): ' + causas.no_alcanzado.tokens.join(', ') + '.');
    }
  }

  if (r.instrumento && r.instrumento.fallos && r.instrumento.fallos.length){
    /* ⚠ Va como reparo y no como freno, y la distinción importa: el instrumento falló, o sea que
     * **el rastro de la corrida está incompleto** — pero eso no dice nada sobre el deck. Lo que
     * cambia es cuánto se puede confiar en los conteos de abajo. */
    reparos.push('El instrumento falló ' + r.instrumento.fallos.length + ' vez/veces: el rastro de ' +
      'etapas está incompleto y los tiempos de abajo no sirven para diagnosticar. El deck no cambia.');
  }

  if (frenos.length){
    return '<div class="veredicto is-freno">' +
      '<div class="veredicto-tit">⛔ Antes de publicarlo, mirá esto</div>' +
      '<ul class="list-reset">' + frenos.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
      (reparos.length ? '<ul class="list-reset veredicto-menor">' + reparos.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') +
      '</div>';
  }
  if (reparos.length){
    return '<div class="veredicto is-reparo">' +
      '<div class="veredicto-tit">⚠ Se puede publicar, sabiendo esto</div>' +
      '<ul class="list-reset">' + reparos.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
      '</div>';
  }
  /* ⚠ **El verde dice QUÉ cubre, y no «está todo bien».** Los huecos marcados siguen ahí y son
   * normales; lo que se afirma es que la corrida terminó y nada quedó sin marca. Un verde que
   * promete más de lo que midió es peor que ninguno. */
  return '<div class="veredicto is-ok">' +
    '<div class="veredicto-tit">✅ La corrida terminó entera y nada quedó sin marcar</div>' +
    '<p class="muted">Los huecos que hayan quedado están marcados con su símbolo, así que se ven. ' +
    'Esto no dice que los números sean los correctos — eso lo dice quien mira el deck.</p></div>';
}

/**
 * ⭐ **La leyenda de los símbolos, en la interfaz y no en la cabeza de nadie.**
 *
 * Hasta hoy la premisa escrita era que el deck sólo lo miraba quien lo desarrolla, y eso está por
 * dejar de ser cierto. **Un símbolo que no se explica es un número que alguien va a interpretar
 * mal** — y el peor caso no es no entenderlo: es leer un `-` como «no hubo nada» cuando significa
 * otra cosa.
 *
 * ⭐⭐ **24/08/2026 — la leyenda ya no tiene que declarar dónde miente: son CINCO y cada uno manda
 * a un solo trabajo.** `»»»` separa *«la corrida no llegó»* de *«nadie lo cableó»*, que era la
 * única ambigüedad que quedaba. ⚠ **Y el borde de la regla se explica en la leyenda**, porque es
 * lo que hace confiable al glifo: un token **sin fila** sale `/////` **aunque la corrida haya
 * cortado**, así que `»»»` significa siempre *«esto está cableado y se resuelve corriendo de
 * nuevo»* — nunca tapa cableado que falta.
 */
function leyendaSimbolos(){
  var filas = [
    ['/////', 'Falta cablearlo', 'nadie escribió su fila todavía — el trabajo es cablear'],
    ['»»»', 'La corrida no llegó', 'está cableado y se cortó por presupuesto — el trabajo es correr de nuevo'],
    ['---', 'Se intentó y falló', 'el dato está cableado y no se pudo leer — mirar la traza'],
    ['-', 'No hay dato', 'se preguntó bien y la respuesta vino vacía'],
    ['-1.234-', 'Dato dudoso', 'se publicó, con la desconfianza declarada — la fuente se mueve sola']
  ];
  return '<div class="box"><div class="section-title">Qué significa cada símbolo del deck</div>' +
    '<ul class="list-reset">' + filas.map(function(f){
      return '<li class="leyenda"><span class="leyenda-glifo mono">' + esc(f[0]) + '</span>' +
        '<span><strong>' + esc(f[1]) + '</strong> — ' + esc(f[2]) + '</span></li>';
    }).join('') + '</ul>' +
    '<p class="muted">⭐ <span class="mono">»»»</span> y <span class="mono">/////</span> mandan a ' +
    'trabajos <strong>opuestos</strong> y por eso son dos símbolos: uno se arregla corriendo de ' +
    'nuevo, el otro escribiendo una fila. ⚠ Un token <strong>sin fila</strong> sale ' +
    '<span class="mono">/////</span> aunque la corrida se haya cortado — si no, el símbolo del ' +
    'corte taparía el cableado que falta.</p></div>';
}

/* ═════════════════════════════════════════════════════════════════════════════════════════
 * `2026-08-26_2` Parte F — **los dos botones para CREAR un período**
 * ═════════════════════════════════════════════════════════════════════════════════════════
 *
 * ⭐ Existen porque hasta hoy la única forma de tener la semana era **una fila en `SEED_PERIODOS_`
 * y un `clasp push`** — que es exactamente la línea de `.gs` que `D-01` mide. El comentario de
 * `agosto_14_20` en el seed lo decía: *«lo que corresponde es que el panel cree el período»*.
 *
 * ⛔⛔ **«Semana en curso» DEROGA `R-11` Addendum 2**, que decidió que el motor propone la última
 * semana **cerrada**. Lo que se deroga es *«el motor nunca ofrece la semana sin cerrar»*; la
 * **propuesta por defecto** sigue siendo la cerrada. La diferencia es quién decide.
 *
 * ⭐⭐ **Y el aviso sale al ELEGIRLA, no al terminar.** Por eso hay una previa —
 * `panel_previaSemanaEnCurso`— antes del botón: una semana sin cerrar trae datos **parciales**, y
 * un número parcial **no se distingue de uno completo mirándolo**. Decirlo después de generar el
 * deck no sirve de nada. */
function bloqueCrearPeriodo(){
  var h = '<hr class="sep">';
  h += '<div class="section-title">¿No está la semana en la lista?</div>';

  var p = S.previaSemana;
  if (p === null || p === 'cargando'){
    h += '<p class="muted">Mirando qué semana está en curso…</p>';
    return h;
  }
  if (!p.ok){
    h += '<p class="hint-error">No se pudo calcular la semana en curso: ' + esc(p.motivo || '') + '</p>';
    return h;
  }

  h += '<p class="hint">Semana en curso: <span class="mono">' + esc(p.periodo_id) + '</span> · ' +
       esc(p.desde) + ' → ' + esc(p.hasta) + '</p>';

  /* ⭐⭐ El aviso ANTES del botón, no después de la corrida. */
  if (p.sin_cerrar){
    h += '<p class="hint-error">⚠ <strong>Esta semana todavía no cerró</strong> (cierra el jueves). ' +
         'Las bases van a estar <strong>parciales</strong>, y un número parcial no se distingue de ' +
         'uno completo mirándolo — medido: una cuenta tenía 11.000 de 54.107 llamados en un export ' +
         'del mismo día. La última semana cerrada es ' + esc(p.ultima_cerrada) + '.</p>';
  }

  if (p.ya_existe){
    h += '<p class="hint">Ya existe en <span class="mono">PERIODOS</span>: elegila en la lista de ' +
         'arriba. No se vuelve a crear ni se pisa.</p>';
  } else {
    h += '<button class="btn btn-secondary" id="b-per-semana">Crear ' + esc(p.periodo_id) + '</button>';
  }

  h += '<div class="field" style="margin-top:12px">' +
       '<label for="f-per-desde">O un período a medida — desde / hasta</label>' +
       '<input id="f-per-desde" type="date">' +
       '<input id="f-per-hasta" type="date">' +
       '<button class="btn btn-secondary" id="b-per-custom">Crear período</button>' +
       /* ⚠ El id se DERIVA. Dejar que alguien lo escriba reabre la puerta a
        * `'vie 14/08 -- jue 20/08 (por defecto)'`, que es una etiqueta usada como clave. */
       '<p class="hint">El nombre se arma solo, con la convención ' +
       '<span class="mono">AAAA_mes_ddInicio_ddFin</span>.</p></div>';

  if (S.periodoMsg){
    h += '<div class="alert ' + (S.periodoMsg.ok ? 'alert-info' : 'alert-warning') + '">' +
         '<div class="alert-title">' + (S.periodoMsg.ok ? 'Listo' : 'No se creó') + '</div>' +
         esc(S.periodoMsg.texto) + '</div>';
  }
  return h;
}

/** Lee la previa de la semana en curso. Una sola vez por sesión de pantalla. */
function cargarPreviaSemana(){
  S.previaSemana = 'cargando';
  google.script.run
    .withSuccessHandler(function(r){ S.previaSemana = r || {ok:false, motivo:'sin respuesta'}; pintar(); })
    .withFailureHandler(function(e){ S.previaSemana = {ok:false, motivo:String(e && e.message || e)}; pintar(); })
    .panel_previaSemanaEnCurso();
}

/**
 * El resultado de crear un período, en una frase.
 *
 * ⭐ **Dice las filas ANTES y DESPUÉS**, no sólo «listo»: es lo único que distingue *«creó»* de
 * *«ya estaba»* de *«informó cero y no pasó nada»*. Y los avisos del backend se pintan enteros.
 */
function mensajeDePeriodo(r){
  if (!r || !r.ok){
    return { ok:false, texto: (r && r.motivo) || 'sin motivo' };
  }
  var partes = [];
  if (r.creadas && r.creadas.length){
    partes.push('Creado ' + r.creadas.map(function(c){
      return c.id + ' (' + c.desde + ' → ' + c.hasta + ')';
    }).join(', '));
  }
  if (r.ya_estaban && r.ya_estaban.length){
    partes.push('Ya estaba' + (r.ya_estaban.length > 1 ? 'n' : '') + ': ' +
      r.ya_estaban.map(function(y){ return y.id; }).join(', ') + ' — no se tocó');
  }
  partes.push('Filas en PERIODOS: ' + r.filas_antes + ' → ' + r.filas_despues);
  if (r.aviso_parcial) partes.push(r.aviso_parcial);
  (r.avisos || []).forEach(function(a){ partes.push(a); });
  if (r.claves_repetidas && r.claves_repetidas.length){
    partes.push('⛔ PERIODOS tiene claves repetidas: ' + r.claves_repetidas.join(', '));
  }
  return { ok:true, texto: partes.join(' · ') };
}

function crearPeriodoSemana(){

/* ⭐ `2026-08-26_2` Parte B — **por cuál de los cinco eslabones salió la ventana.**

 * `resolverVentana` es la cadena de `D-20` y hasta hoy el panel mostraba **la etiqueta y nada

 * cuenta una pregunta del backend miente justo donde la persona mira. */
function nivelDeVentana(nivel){
  var n = String(nivel || '');
  if (!n) return '';
  if (n.indexOf('periodo_ref:') === 0) return 'período elegido: ' + n.slice(12);
  if (n.indexOf('campana:') === 0)     return 'ventana de la campaña ' + n.slice(8);
  if (n.indexOf('seccion:') === 0)     return 'ventana de la sección ' + n.slice(8);
  if (n === 'config')                  return 'la ventana de CONFIG';
  if (n === 'R-11 (calculado)')        return 'calculada: la última semana cerrada (R-11)';

}

function vistaListo(){

  var h = veredictoDePublicacion(r);
  h += deckCard(r.deck, (inf && inf.nombre) || S.informeId,
    esc(r.periodo || '') +
    /* ⭐ El NIVEL, al lado de la etiqueta. Sin esto el deck no dice de dónde salió su ventana. */
    (r.periodo_nivel ? ' · ' + esc(nivelDeVentana(r.periodo_nivel)) : '') +

    ' · corrida ' + esc(r.corrida_id || ''));

  /* ⭐ `2026-08-21_1` — **`presupuesto` salió de esta lista.** Viaja siempre, así que caía
   * siempre en el `||` final y pintaba un cartel de advertencia con el JSON entero **en toda

  ['corte','fallo','instrumento'].forEach(function(k){

    if (!a) return;

    var titulo = (k === 'corte' && a.clase === 'arranque_no_entra')
      ? 'el arranque no entra en el techo — correr de nuevo da lo mismo'

  h += '<div class="stats">' +
    stat('Datos distintos en el deck', '', c.tokens_distintos) +

    stat('Datos que faltaron', 'uno por dato y por lámina', c.filas_en_faltantes) +
    '</div>';

  /* `2026-08-20_1` Parte A — **quien dice qué se imprimió es el backend, que es el que lo

   * del front: con el checkbox tildado la frase decía "una raya" aunque el backend mandara otra
   * cosa, sin fallar. Un front que contesta por su cuenta una pregunta del backend es la misma
   * clase de falla que un testigo que no mide el cambio. El `||` se retira; si el valor no se
   * reconoce, se lo muestra crudo en vez de inventar la frase. */
  h += '<p class="muted">Los huecos se imprimieron como ' +
    (r.presentacion_faltantes === 'simbolos' ? 'símbolos (/////, ---, -)'
      : r.presentacion_faltantes === '«FALTA:token»' ? 'un aviso de falta'
      : esc(String(r.presentacion_faltantes || '(sin declarar)'))) +
    '. La corrida tardó ' + S.elapsed + ' s de un techo de ' + TECHO_S + ' s.</p>';

  /* ⭐ Parte E regla 2 — la leyenda **sólo si el deck salió con símbolos**. Con el modo crudo los
   * huecos dicen `«FALTA:token»` con el nombre adentro y una leyenda de glifos no aplicaría a
   * nada: explicaría algo que no está en el deck que la persona tiene delante. */
  if (r.presentacion_faltantes === 'simbolos') h += leyendaSimbolos();

  var secs = r.secciones || [];
  if (secs.length){
    h += '<div><span class="section-title">Secciones repetibles</span><ul class="list-reset">' +
      secs.map(function(s){
        var id = (typeof s === 'string') ? s : (s.seccion_id || s.id || '');
        var emitida = (typeof s === 'string') ? true : (s.items > 0 || s.emitida === true);
        return '<li class="dot-row"><span class="dot ' + (emitida?'dot-on':'dot-off') + '"></span>' +
          esc(id) + '</li>';
      }).join('') + '</ul></div>';
  }

  /* ⭐ `2026-08-21_1` A.4 — **el bloque del reloj va ÚLTIMO, después del veredicto.**
   * `CLAUDE.md` §4: un `⚠` en el medio de un reporte que termina bien se lee como verde. */
  var pr = r.presupuesto;
  if (pr){
    var avisos = [];
    var cpe = pr.control_por_etapa;
    if (cpe && cpe.con_control < cpe.total){
      avisos.push('⛔ ' + (cpe.total - cpe.con_control) + ' etapa(s) sin punto de control del reloj: ' +
        cpe.etapas.filter(function(e){ return !e.tiene; }).map(function(e){ return e.etapa; }).join(', ') +
        '. Una corrida que se pase ahí muere en el muro sin dejar nada.');
    }
    if (pr.aviso_reserva) avisos.push(pr.aviso_reserva);

    h += '<div class="box"><span class="section-title">Reloj</span>' +
      '<p class="muted">' + pr.gastado_seg + ' s de un techo de ' + pr.techo_seg +
      ' s (muro ' + MURO_S + ' s) · reserva ' + pr.reserva_seg + ' s · el cierre costó ' +
      (pr.cierre_seg === undefined ? '?' : pr.cierre_seg) + ' s.' +
      (cpe ? ' Etapas con punto de control: ' + cpe.con_control + ' de ' + cpe.total + '.' : '') +
      '</p>' +
      avisos.map(function(a){ return '<p class="muted">' + esc(a) + '</p>'; }).join('') +
      '</div>';
  }

  h += '<button class="btn btn-secondary" id="b-otro">Generar otro</button>';
  return h;
}

function stat(label, unidad, valor){
  return '<div class="stat"><span class="stat-label">' + esc(label) +
    (unidad ? '<span class="stat-unit">' + esc(unidad) + '</span>' : '') +
    '</span><span class="stat-value">' + num(valor) + '</span></div>';
}

function vistaFallo(){
  return '<div class="alert alert-error"><div class="alert-title">No se pudo generar el informe.</div>' +
    esc(S.motivo || '') + '</div>' +
    '<p class="muted">No se generó ningún deck ni quedó registrada una corrida cerrada.</p>' +
    '<button class="btn btn-secondary" id="b-volver">Volver</button>';
}

/* ═══ `2026-08-21_19` Parte B — ver la corrida mientras corre ════════════════════════════════
 *
 * Sin esta pantalla el botón desatendido es **peor** que el de siempre: hoy la persona ve el
 * resultado, y con el desatendido no vería nada durante minutos.
 *
 * ⚠ **Nada se calcula acá.** Los estados, los conteos y el sello los decide `panel_estadoDesatendida`,
 * que los lee de `PLAN_CORRIDA` y del estado guardado. Un front que contesta por su cuenta una
 * pregunta del backend es la misma clase de falla que el `TECHO_S = 350` escrito a mano.
 */
function vistaDesatendida(){
  var h = '';

  // El resultado del botón se muestra una vez, arriba, y **dice los dos finales distinto**:
  // «entró de una» manda a abrir el deck; «cortó y sigue» manda a mirar el plano de abajo.
  var a = S.desArranque;
  if (a){
    if (!a.ok){
      h += '<div class="alert alert-error"><div class="alert-title">No arrancó.</div>' +
        esc(a.motivo || '') +
        (a.corrida_id ? '<br>Corrida en curso: <b>' + esc(a.corrida_id) + '</b>' +
          (a.ejecucion ? ' (ejecución ' + esc(a.ejecucion) + ')' : '') +
          '. Frenala con el botón de abajo antes de arrancar otra.' : '') +
        '</div>';
    } else if (a.terminada){
      h += '<div class="alert alert-warning"><div class="alert-title">Entró en una sola ejecución.</div>' +
        'No hizo falta reanudar nada — la corrida terminó completa. Para una semana así, el botón ' +
        '<b>Generar informe</b> es más barato: no paga el arranque dos veces.</div>';
    } else if (a.continua){
      h += '<div class="alert alert-warning"><div class="alert-title">La corrida cortó y sigue sola.</div>' +
        'Quedó plan y hay un trigger andando: la próxima ejecución arranca en un minuto. ' +
        'Esta pantalla no se refresca sola.</div>';
    }
  }

  if (S.desMsg){
    h += '<div class="alert ' + (S.desMsg.ok ? 'alert-warning' : 'alert-error') + '">' +
      esc(S.desMsg.texto) + '</div>';
  }

  if (S.desCargando || S.des === null){
    return h + '<p class="muted">Leyendo el estado de la corrida…</p>' +
      '<button class="btn btn-secondary" id="b-des-refrescar">Actualizar</button>';
  }

  var d = S.des;
  if (!d.ok){
    return h + '<div class="alert alert-error"><div class="alert-title">No se pudo leer el estado.</div>' +
      esc(d.motivo || '') + '</div>' +
      '<button class="btn btn-secondary" id="b-des-refrescar">Actualizar</button>';
  }

  /* ⭐ De cuándo es lo que se está mirando. Va ARRIBA de los números y no al pie: si el dato es
   * viejo, eso cambia cómo se lee todo lo demás. */
  h += '<p class="muted">Leído a las ' + esc(d.leido) + '. Esta pantalla no se actualiza sola.</p>';

  if (!d.corrida_id){
    return h + '<p class="muted">' + esc(d.motivo || 'No hay ninguna corrida desatendida.') + '</p>' +
      '<button class="btn btn-secondary" id="b-des-refrescar">Actualizar</button>';
  }

  h += '<div class="bloque"><span class="section-title">' +
    (d.en_curso ? 'Corrida en curso' : 'Última corrida con plan') + '</span>' +
    '<p class="muted">' + esc(d.corrida_id) +
    (d.informe_id ? ' · informe ' + esc(d.informe_id) : '') +
    (d.periodo_id ? ' · período ' + esc(d.periodo_id) : '') +
    (d.en_curso ? ' · ejecución ' + esc(d.ejecucion) + ' de ' + esc(d.tope) : '') +
    '</p>';
  if (!d.en_curso && d.motivo) h += '<p class="muted">' + esc(d.motivo) + '</p>';
  h += '</div>';

  /* ⛔ El invariante roto va antes que nada: significa que algo marcó `hecha` una sección que no
   * se resolvió, y entonces **todo el plan de abajo miente**. */
  if (d.invariante_roto){
    h += '<div class="alert alert-error"><div class="alert-title">⛔ Invariante roto</div>' +
      esc(d.invariante_roto) + '</div>';
  }

  /* ⭐ **El sello es lo que contesta «¿está listo?»**, y vive en el nombre del deck. No se deduce
   * de los tokens: los crudos NO dicen qué falta — las láminas escondidas dejan 49 crudos
   * permanentes en toda corrida, incluso en una que terminó perfecta. */
  if (d.deck){
    h += deckCard(d.deck, d.deck.nombre || d.informe_id || 'deck',
      d.deck.sellado === true  ? '⛔ sellado «[en proceso]» — NO está terminado'
    : d.deck.sellado === false ? '✅ sin sello — está terminado'
    : '⚠ no se pudo leer el nombre del deck, así que no se sabe si está sellado' +
      (d.deck.motivo ? ': ' + esc(d.deck.motivo) : ''));
  }

  var plan = d.plan || [];
  h += '<div><span class="section-title">Plan por sección</span>';
  if (!plan.length){
    h += '<p class="muted">El plan no tiene filas.</p>';
  } else {
    h += '<p class="muted">' + d.hechas + ' hecha(s) · ' + d.pendientes + ' pendiente(s) de ' +
      plan.length + '.</p>';
    h += '<ul class="list-reset">' + plan.map(function(f){
      var hecha = f.estado === 'hecha';
      /* ⚠ **`hecha` con `segundos` vacío se marca**: ésa es la huella exacta que delató el bug
       * del 20/08 —tres secciones marcadas hechas que el resolver nunca tocó— y la única que se
       * ve desde afuera. No se esconde y no se rellena. */
      var sospechosa = hecha && (f.segundos === '' || f.segundos === null);
      return '<li class="dot-row"><span class="dot ' + (hecha?'dot-on':'dot-off') + '"></span>' +
        esc(f.seccion_id) + ' — <b>' + esc(f.estado || '(sin estado)') + '</b>' +
        ' · ' + f.asignaciones + ' asignación(es)' +
        (f.ejecucion !== '' ? ' · ejecución ' + esc(f.ejecucion) : '') +
        (f.segundos !== '' ? ' · ' + esc(f.segundos) + ' s' : '') +
        (sospechosa ? ' <b>⚠ marcada hecha sin tiempo: el resolver puede no haberla tocado</b>' : '') +
        '</li>';
    }).join('') + '</ul>';
  }
  h += '</div>';

  h += '<button class="btn btn-secondary" id="b-des-refrescar">Actualizar</button>';
  if (d.en_curso){
    h += '<button class="btn btn-secondary" id="b-des-frenar">Frenar la corrida</button>';
  }
  return h;
}

function conectarDesatendida(){
  var br = el('b-des-refrescar'); if (br) br.onclick = cargarDesatendida;
  var bf = el('b-des-frenar');    if (bf) bf.onclick = cancelarDesatendida;
}

/**
 * ⭐⭐ `2026-09-01_3` B.1 — **el historial abre el deck.** Hasta hoy `deck_id` viajaba en el
 * objeto (`PanelBackend.gs`, `panel_ultimasCorridas`) y esta vista **no lo usaba**: se llegaba a un
 * deck de otro momento **sólo** por la vía rápida de «Generar» (`corridaPrevia`). Era la premisa
 * falsa sobre la que se apoyaba subir esta pestaña al primer nivel.
 *
 * ⛔ **Tres estados, no dos**, y el del medio es el que no existía:
 *
 *   1. cerrada **con** `deck_id` → la fila entera es un enlace;
 *   2. ⚠ cerrada **sin** `deck_id` → **no lleva enlace y lo dice**. Sin esta rama sería
 *      indistinguible de una fila común, que es *«no hay»* leído como *«no miré»*;
 *   3. no cerrada → lo de siempre: murió y nunca escribió su fecha.
 *
 * ⚠ **Un enlace roto y uno ausente no son lo mismo, y el que miente es el roto.** La regla ya
 * estaba medida en `deckCard` (el `[object Object]` del 21/08) y acá se reusa la regla, no la
 * función: `deckCard` dibuja una tarjeta y cambiaría el aspecto de la lista.
 */
function vistaCorridas(){
  if (S.corridasCargando || S.corridas === null) return '<p class="muted">Cargando corridas…</p>';
  if (!S.corridas.length) return '<p class="muted">Todavía no hay corridas registradas.</p>';
  var nombres = {};
  S.informes.forEach(function(i){ nombres[i.id] = i.nombre; });

  var cerradas = 0, conDeck = 0;
  S.corridas.forEach(function(c){
    if (!c.cerrada) return;
    cerradas++;
    if (String(c.deck_id || '').trim()) conDeck++;
  });
  var sinDeck = cerradas - conDeck;

  /* ⭐ **El conteo se declara aunque dé cero**, y **declara sobre qué corrió**: son las que este
   * panel pidió —`panel_ultimasCorridas(10)`—, **no el total de `CORRIDAS`**. Un conteo de un
   * subconjunto presentado como el total es el modo de falla de siempre. */
  var h = '<p class="hint">' + S.corridas.length + ' corrida(s) cargadas (las últimas que pide el ' +
          'panel, no el total de <span class="mono">CORRIDAS</span>) · ' + cerradas + ' cerrada(s) · ' +
          conDeck + ' con deck' +
          (sinDeck > 0 ? ' · <b>⚠ ' + sinDeck + ' cerró sin registrar el deck_id</b>' : ' · 0 sin deck_id') +
          '.</p>';

  return h + S.corridas.map(function(c){
    var deckId = String(c.deck_id || '').trim();
    var izq = '<div><div class="run-name">' + esc(nombres[c.informe_id] || c.informe_id) + '</div>';
    if (!c.cerrada){
      /* `cerrada: false` es una corrida que murió: nunca escribió su fecha. No es un deck que
       * se pueda abrir, así que no lleva link ni conteo. */
      izq += '<div class="run-when is-dead">no cerró — sin fecha de generación</div>';
    } else if (deckId){
      izq += '<div class="run-when">' + esc(c.fecha_generacion) + '</div>';
    } else {
      izq += '<div class="run-when">' + esc(c.fecha_generacion) + '</div>' +
             '<div class="run-when is-dead">⚠ cerró sin registrar el deck_id — no hay a dónde ir</div>';
    }
    izq += '</div>';
    var der = c.cerrada ? '<span class="run-count">' + esc(c.faltantes || '0') + ' sin dato</span>' : '';

    /* ⚠ La URL se arma igual que en `deckCard` cuando sólo hay id. `panel_ultimasCorridas` no
     * devuelve `url`, así que no hay una emitida por el motor que preferir. */
    if (c.cerrada && deckId){
      return '<a class="run run-link" target="_blank" rel="noopener" ' +
        'href="https://docs.google.com/presentation/d/' + esc(deckId) + '/edit">' + izq + der + '</a>';
    }
    return '<div class="run">' + izq + der + '</div>';
  }).join('');
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * Anclajes — `2026-08-21_16` Parte C
 * ══════════════════════════════════════════════════════════════════════════════════════════════
 *
 * `D-29` (addendum 21/08) decidió que esta pantalla **lee `ANCLAJE_PENDIENTE`** y no corre
 * `anclarEncuentros`, que tardaría ~50 s en cada apertura. Lo que se ve es lo que dejó la última
 * corrida — **y es exactamente lo que la próxima va a leer**, porque la hoja no es un caché: es
 * el registro que el motor consulta con `anclajeYaConfirmado_` antes de anclar.
 */
function cargarAnclajes(){
  /* ⚠ **Sin `pintar()` acá**, y no es un olvido: `vistaAnclajes()` llama a esta función, y
   * `vistaAnclajes()` corre **desde adentro** de `pintar()`. Pintar de nuevo desde acá reentra en
   * el mismo `pintar()` que todavía no terminó. El estado `'cargando'` alcanza: quien llamó ya
   * está por escribir el HTML, y el handler pinta cuando llega la respuesta. */
  S.anclajes = 'cargando';
  google.script.run
    .withSuccessHandler(function(r){ S.anclajes = r || {ok:false, motivo:'sin respuesta'}; pintar(); })
    .withFailureHandler(function(e){ S.anclajes = {ok:false, motivo:String(e && e.message || e)}; pintar(); })
    .panel_getAnclajes();
}

function confirmarAnclaje(tipo, nombre, elegido){
  S.anclajesMsg = null;
  google.script.run
    .withSuccessHandler(function(r){
      S.anclajesMsg = r && r.ok
        ? {ok:true, texto: (r.accion === 'confirmado' ? 'Confirmado: ' + r.elegido : 'Desconfirmado')}
        : {ok:false, texto: (r && r.motivo) || 'no se pudo escribir'};
      // Se relee la hoja: lo que vale es lo que quedó escrito, no lo que se pidió.
      cargarAnclajes();
      pintar();
    })
    .withFailureHandler(function(e){
      S.anclajesMsg = {ok:false, texto:String(e && e.message || e)};
      pintar();
    })
    .panel_confirmarAnclaje(tipo, nombre, elegido);
}

/* ⭐ `2026-08-21_19` Parte C — **archivar una huérfana, y poder traerla de vuelta.**
 *
 * ⚠ **Archivar no borra**: la fila se queda, porque es el registro que el motor consulta antes de
 * anclar y borrarla haría que la próxima corrida vuelva a preguntar lo mismo. Lo único que cambia
 * es que deja de ocupar la pantalla.
 *
 * **Y se relee la hoja después**, igual que al confirmar: lo que vale es lo que quedó escrito, no
 * lo que se pidió. */
function archivarAnclaje(tipo, nombre, archivar){
  S.anclajesMsg = null;
  google.script.run
    .withSuccessHandler(function(r){
      S.anclajesMsg = r && r.ok
        ? {ok:true, texto:(r.accion === 'archivada'
            ? 'Archivada: ' + r.nombre_buscado + '. La fila sigue en la hoja — sólo se sacó de la vista.'
            : 'Vuelve a la vista: ' + r.nombre_buscado)}
        : {ok:false, texto:(r && r.motivo) || 'no se pudo escribir'};
      cargarAnclajes();
      pintar();
    })
    .withFailureHandler(function(e){
      S.anclajesMsg = {ok:false, texto:String(e && e.message || e)};
      pintar();
    })
    .panel_archivarAnclaje(tipo, nombre, archivar);
}

/** Una fila de anclaje, con sus candidatos y el umbral al lado. */
function filaAnclaje(a, umbral, confirmada){
  var tipo = JSON.stringify(a.tipo), nom = JSON.stringify(a.nombre_buscado);

  var cands = (a.candidatos || []).map(function(c){
    var p = Number(c.puntaje);
    /* ⚠ El puntaje se muestra CONTRA EL UMBRAL, no solo. Un 0,54 no significa nada sin el 0,6
     * al lado — es la misma razón por la que `D-29` los reporta juntos en `excluidos`. */
    var bajo = !isNaN(p) && !isNaN(umbral) && p < umbral;
    var elegido = confirmada && a.elegido === c.nombre;
    return '<li class="run">' +
      '<div><div class="run-name">' + esc(c.nombre) + (elegido ? ' ✓' : '') + '</div>' +
      '<div class="run-when"><span class="mono">' + esc(isNaN(p) ? String(c.puntaje) : p.toFixed(2)) +
      '</span>' + (bajo ? ' · por debajo del umbral ' : ' · umbral ') +
      '<span class="mono">' + esc(String(umbral)) + '</span></div></div>' +
      (elegido
        ? '<button type="button" onclick=\'confirmarAnclaje(' + tipo + ',' + nom + ',"")\'>Desconfirmar</button>'
        : '<button type="button" onclick=\'confirmarAnclaje(' + tipo + ',' + nom + ',' +
          JSON.stringify(c.nombre) + ')\'>Elegir</button>') +
      '</li>';
  }).join('');

  /* ⛔ El límite 2 del addendum a `D-29`: la hoja ACUMULA y `registrarAnclajePendiente_` nunca
   * borra, así que puede haber filas de encuentros que ya no van al deck. Se marcan — no se
   * borran ni se esconden. */
  var vieja = a.vigente === false
    ? '<div class="run-when">⚠ <strong>ninguna reunión vigente la reclama</strong> — quedó de una ' +
      'corrida anterior, o la reunión pasó a <span class="mono">mostrar = no</span>. ' +
      'Confirmarla no cambia el deck de esta semana. ' +
      /* ⭐ Parte C — el botón vive **acá y sólo acá**: en la fila que ya está marcada como
       * huérfana. Una fila vigente no lo ofrece, y el backend además lo rechaza. */
      '<button type="button" onclick=\'archivarAnclaje(' + tipo + ',' + nom + ',true)\'>' +
      'Archivar</button></div>'
    : '';

  /* ⚠ Una fila archivada que VOLVIÓ a estar vigente se muestra igual —la condición de esconder es
   * `archivada && !vigente`— y hay que decir por qué reapareció, o parece que el archivado no
   * funcionó. */
  var revivio = (a.archivada === true && a.vigente === true)
    ? '<div class="run-when">↩ estaba archivada y <strong>volvió</strong>: una reunión vigente la ' +
      'reclama otra vez. ' +
      '<button type="button" onclick=\'archivarAnclaje(' + tipo + ',' + nom + ',false)\'>' +
      'Sacarle la marca</button></div>'
    : '';

  return '<div class="box">' +
    '<div class="run-name">' + esc(a.nombre_buscado) + ' <span class="mono">(' + esc(a.tipo) + ')</span></div>' +
    vieja + revivio +
    (cands ? '<ul class="list-reset">' + cands + '</ul>'
           : '<p class="muted">Sin candidatos puntuados. No hay nada que elegir desde acá.</p>') +
    '</div>';
}

/* ⭐ `2026-08-23_1` Parte D — **la medición del anclaje, arriba de los pendientes.**
 *
 * ⛔ Una pantalla de anclajes vacía significa dos cosas opuestas —«no corrió» y «corrió y nadie
 * cayó bajo el umbral»— y mandan a trabajos distintos. La medición es lo que las separa: con
 * `intentados > 0` y cero pendientes, el vacío de abajo es un resultado y no un silencio.
 *
 * ⚠ **Va ARRIBA de los pendientes**, no en un pie, porque cambia cómo se lee todo lo de abajo.
 */
function bloqueMedicionAnclaje(){
  var m = S.medAnclaje;
  if (m === null || m === 'cargando'){
    return '<p class="muted">Leyendo la última medición del anclaje…</p>';
  }
  if (!m.ok){
    return '<div class="alert alert-warning"><div class="alert-title">No se pudo leer la medición.</div>' +
      esc(m.motivo || '') + '</div>';
  }
  if (!m.hay){
    /* ⚠ Y esto tampoco dice «no ancló nunca»: la hoja nació el 23/08. Es «no sé», con el motivo. */
    return '<div class="box"><div class="section-title">Cuánto se midió</div>' +
      '<p class="muted">' + esc(m.motivo) + '. <strong>Mientras tanto, una lista vacía abajo no ' +
      'distingue «no corrió» de «corrió y nadie quedó dudoso».</strong></p></div>';
  }

  /* ⭐⭐ `2026-08-24_2` Parte D — **la fila de un FALLO no dice «0 de 0 anclaron».**
   *
   * `registrarFalloAnclaje_` (25/08) deja los contadores **vacíos a propósito**: un `0` afirmaría
   * *«se intentó anclar cero y salió bien»*, que es falso. El motivo viaja en `sin_link_detalle`,
   * que en un fallo no tiene otro uso. ⚠ Y hasta hoy el backend convertía ese vacío en `0` — o sea
   * que **`num()` ya sabía pintar el `—` y nunca le llegaba**. */
  if (m.es_fallo){
    return '<div class="falt-grupo is-frena">' +
      '<div class="falt-head" style="cursor:default">' +
      '<div><div class="run-name">⛔ El anclaje FALLÓ — no llegó a intentar</div>' +
      '<div class="run-when">' + esc(m.cuando) +
        (m.periodo_id ? ' · ' + esc(m.periodo_id) : ' · sin filtrar por período') + '</div></div>' +
      '<span class="run-count">sin medición</span>' +
      '</div>' +
      (m.sin_link_detalle.length
        ? '<ul class="list-reset falt-lista">' + m.sin_link_detalle.map(function(t){
            return '<li class="falt-token"><div class="falt-motivo">' + esc(t) + '</div></li>';
          }).join('') + '</ul>'
        : '<ul class="list-reset falt-lista"><li class="falt-token"><div class="falt-motivo">' +
          'sin motivo registrado</div></li></ul>') +
      bloqueDesfaseAnclaje(m) +
      '</div>';
  }

  var noAnclo = m.sin_link + m.baja_confianza;
  var detalle = m.sin_link_detalle.length
    /* ⭐ Tal cual llegan, con su motivo. Un conteo de `sin_link` sin los nombres dice que hubo un
     * problema y no dice cuál; los nombres son lo que permite ir a mirar la fila de `rdv`. */
    ? '<ul class="list-reset falt-lista">' + m.sin_link_detalle.map(function(t){
        return '<li class="falt-token"><div class="falt-motivo">' + esc(t) + '</div></li>';
      }).join('') + '</ul>'
    : '';

  return '<div class="falt-grupo' + (noAnclo ? ' is-frena' : '') + '">' +
    '<div class="falt-head" style="cursor:default">' +
    '<div><div class="run-name">' + num(m.anclados) + ' de ' + num(m.intentados) + ' encuentro(s) anclaron</div>' +
    '<div class="run-when">' + esc(m.cuando) +
      (m.ventana ? ' · ventana ' + esc(m.ventana) : '') +
      (m.periodo_id ? ' · ' + esc(m.periodo_id) : ' · sin filtrar por período') +
      ' · umbral ' + esc(String(m.umbral)) + '</div></div>' +
    '<span class="run-count">' + (noAnclo ? '⚠ ' + num(noAnclo) + ' sin anclar' : 'todos') + '</span>' +
    '</div>' +
    (noAnclo
      ? '<ul class="list-reset falt-lista">' +
        '<li class="falt-token"><div class="run-name">' + num(m.sin_link) + ' sin cuenta digital (sinLink)</div>' +
        '<div class="run-when">salen igual en el deck (<span class="mono">R-02</span>), con sus números de digital en falta</div>' +
        (detalle ? '</li>' : '</li>') +
        (detalle ? '<li class="falt-token">' + detalle + '</li>' : '') +
        '<li class="falt-token"><div class="run-name">' + num(m.baja_confianza) + ' por debajo del umbral</div>' +
        '<div class="run-when">no se emiten, para no publicar la fila de <span class="mono">rdv</span> equivocada — son los de abajo</div></li>' +
        '</ul>'
      : '') +
    bloqueDesfaseAnclaje(m) +
    '</div>';
}

/* ⭐⭐ `2026-08-24_2` Parte D — **la hora de esta fila contra la de la última corrida.**
 *
 * ⛔ **El caso que lo pide, y costó una vuelta el 25/08:** hasta `9c48769` un anclaje que fallaba
 * **no escribía fila**, así que la última se leía como *«lo último que pasó»* cuando era *«lo
 * último que salió bien»* — y una fila de las 17:12 comparada contra un fallo de las 20:07 hizo
 * parecer que dos instrumentos de la misma corrida se contradecían. **Nadie mentía: al fallo le
 * faltaba fila.**
 *
 * ⚠ **Muestra el desfase; no dice qué significa.** Puede ser un fallo sin fila —el caso viejo, ya
 * corregido— o una corrida que sencillamente no ancló. Las dos mandan a trabajos distintos y la
 * pantalla no tiene con qué elegir. Lo que sí hace es que **se vea, en vez de descubrirse
 * comparando dos hojas a mano**.
 */
function bloqueDesfaseAnclaje(m){
  var d = m.desfase;
  if (!d) return '';
  if (!d.ok){
    // «No se pudo comparar» no es «no hay desfase»: se dice, en gris, y no se calla.
    return '<div class="run-when" style="padding:6px 12px">Sin comparar contra la última corrida: ' +
      esc(d.motivo || '') + '</div>';
  }
  var pie = 'última corrida: ' + esc(d.corrida_cuando) +
    (d.corrida_id ? ' · <span class="mono">' + esc(d.corrida_id) + '</span>' : '');
  if (d.hay_desfase !== true){
    return '<div class="run-when" style="padding:6px 12px">' + pie + '</div>';
  }
  return '<div class="alert alert-warning" style="margin:8px 12px 12px">' +
    '<div class="alert-title">⚠ Esta medición es anterior a la última corrida</div>' +
    'La fila es de <strong>' + esc(m.cuando) + '</strong> y la última corrida es de <strong>' +
    esc(d.corrida_cuando) + '</strong> — <strong>' + num(d.minutos) + ' minuto(s)</strong> después. ' +
    'O esa corrida no ancló nada, o su anclaje falló sin dejar fila. ' +
    '<strong>Lo de arriba no es de la corrida que estás mirando.</strong>' +
    '<div class="run-when" style="margin-top:6px">' + pie + '</div></div>';
}

function cargarMedicionAnclaje(){
  // Sin `pintar()` acá: `vistaAnclajes()` corre desde adentro de `pintar()`.
  S.medAnclaje = 'cargando';
  google.script.run
    .withSuccessHandler(function(r){ S.medAnclaje = r || {ok:false, motivo:'sin respuesta'}; pintar(); })
    .withFailureHandler(function(e){ S.medAnclaje = {ok:false, motivo:String(e && e.message || e)}; pintar(); })
    .panel_ultimaMedicionAnclaje();
}

function vistaAnclajes(){
  if (!FLAGS.anclajes){
    return '<div class="box">Confirmar a mano el encuentro de una campaña está diseñado, pero ' +
      '<strong>todavía no funciona desde acá</strong>.</div>' +
      '<p class="muted">Mientras tanto, un encuentro que el motor no puede asociar con seguridad ' +
      'queda listado aparte con su puntaje, y lo decide una persona.</p>';
  }

  if (S.anclajes === null){ cargarAnclajes(); return '<p class="muted">Leyendo…</p>'; }
  if (S.anclajes === 'cargando'){ return '<p class="muted">Leyendo…</p>'; }
  if (!S.anclajes.ok){
    return '<div class="box">No se pudo leer <span class="mono">ANCLAJE_PENDIENTE</span>: ' +
      esc(S.anclajes.motivo || '') + '</div>';
  }

  var d = S.anclajes;
  var h = '';

  if (S.anclajesMsg){
    h += '<div class="box">' + (S.anclajesMsg.ok ? '✅ ' : '⛔ ') + esc(S.anclajesMsg.texto) + '</div>';
  }

  /* ⭐ Parte D — **la medición va arriba de todo, y no en un pie.** Es lo que le da sentido a lo
   * que sigue: sin ella, una lista vacía abajo no distingue «no corrió» de «no hubo dudosos». */
  if (S.medAnclaje === null) cargarMedicionAnclaje();
  h += bloqueMedicionAnclaje();

  /* ⭐ **De cuándo es lo que se está mirando, dicho en pantalla** — es lo que decidió la Parte A.
   * Sin esta línea, la pantalla se lee como el estado de hoy y no lo es. */
  h += '<p class="muted">Esto es lo que dejó <strong>la última corrida</strong>, no un cálculo de ' +
    'ahora — y es exactamente lo que va a leer la próxima. Un encuentro que todavía no pasó por ' +
    'ninguna corrida <strong>no aparece acá</strong>: esta pantalla muestra lo pendiente de ' +
    'confirmar, no todo lo anclable.</p>';

  /* ⚠ **El camino de la hoja vacía también pasa por acá con la medición ya puesta arriba**, y ése
   * es el caso que la Parte D vino a arreglar: es justo cuando la pantalla no decía nada. */
  if (!d.existe_hoja || (!d.pendientes.length && !d.confirmadas.length)){
    /* ⚠ El cartel dice POR QUÉ puede estar vacía. Un "no hay datos" a secas se lee como error, y
     * acá vacío es el estado normal: significa que ningún anclaje cayó bajo el umbral. */
    h += '<div class="box">No hay ningún anclaje esperando decisión.</div>' +
      '<p class="muted">Puede ser por dos motivos, y los dos son normales: <strong>todavía no ' +
      'corrió ningún informe</strong> en esta planilla, o <strong>ningún encuentro quedó por ' +
      'debajo del umbral</strong> <span class="mono">' + esc(String(d.umbral)) + '</span> — que ' +
      'es el caso bueno. No es un error.</p>';
    return h;
  }

  h += '<h3>Esperando decisión (' + d.pendientes.length + ')</h3>';
  h += d.pendientes.length
    ? d.pendientes.map(function(a){ return filaAnclaje(a, d.umbral, false); }).join('')
    : '<p class="muted">Ninguno. Todos los anclajes registrados ya tienen decisión.</p>';

  /* ⚠ Las confirmadas van VISIBLES y no escondidas: son las decisiones que la próxima corrida va
   * a respetar sin volver a preguntar, y esconderlas las vuelve invisibles. */
  h += '<h3>Ya decididos (' + d.confirmadas.length + ')</h3>';
  h += '<p class="muted">La próxima corrida los respeta <strong>sin volver a preguntar</strong>.</p>';
  h += d.confirmadas.length
    ? d.confirmadas.map(function(a){ return filaAnclaje(a, d.umbral, true); }).join('')
    : '<p class="muted">Ninguno todavía.</p>';

  /* ⭐ Parte C — **el total NO baja al archivar, y ésa es la mitad del valor.** `sin_reunion`
   * cuenta todas las huérfanas, archivadas incluidas; si contara sólo las visibles, archivar haría
   * bajar el número y el problema **parecería resolverse solo** — que es justo lo que archivar no
   * hace. Lo que se dice al lado es cuántas están escondidas. */
  if (d.sin_reunion > 0){
    var arch = Number(d.archivadas) || 0;
    h += '<p class="muted">⚠ ' + d.sin_reunion + ' de estas filas no las reclama ninguna reunión ' +
      'vigente' + (arch ? ', y ' + arch + ' de ésas están <strong>archivadas</strong> y no se ' +
      'muestran arriba' : '') + '. Nada se borra: archivar sólo las saca de la vista, y vuelven ' +
      'solas si una reunión vigente las reclama de nuevo.</p>';
    if (arch){
      h += '<p class="muted">Para ver una archivada hay que abrir <span class="mono">' +
        'ANCLAJE_PENDIENTE</span> y vaciar su celda <span class="mono">archivada</span>.</p>';
    }
  }
  return h;
}


/* ═══════════════════════════════════════════════════════════════════════════════
 * Faltantes — `2026-08-23_1` Parte B
 *
 * ⭐ **Quién mira esto y para qué:** una persona que acaba de generar un deck y necesita saber, en
 * diez segundos, **si puede publicarlo**. Por eso lo que va arriba no es el conteo de faltantes
 * —un deck con cien `/////` es normal y publicable— sino **lo que salió mal en silencio**: un
 * token que resolvió y no se pintó, o una hoja con dos `corrida_id` mezclados.
 *
 * ⚠ **El agrupamiento es por CAUSA y no por tamaño**, porque cada causa manda a un oficio
 * distinto. Un solo token en «el escritor no lo pisó» vale más que cien sin cablear.
 * ═══════════════════════════════════════════════════════════════════════════════ */

/* Las causas que frenan la publicación. **No es «las graves»**: son las dos que significan que el
 * motor hizo algo mal, contra las que significan que falta trabajo declarado. */
var CAUSAS_QUE_FRENAN = { escritor: true, sin_clasificar: true };

function cargarFaltantes(){
  /* ⚠ Sin `pintar()` acá, igual que en anclajes: `vistaFaltantes()` corre **desde adentro** de
   * `pintar()`, y repintar desde acá reentraría en el mismo `pintar()` que no terminó. */
  S.falt = 'cargando';
  google.script.run
    .withSuccessHandler(function(r){ S.falt = r || {ok:false, motivo:'sin respuesta'}; pintar(); })
    .withFailureHandler(function(e){ S.falt = {ok:false, motivo:String(e && e.message || e)}; pintar(); })
    .panel_faltantes(S.faltCual);
}

/** Un grupo de causa, plegado por defecto salvo los que frenan la publicación. */
function grupoFaltante(g){
  var abierto = (S.faltAbierto[g.causa] === undefined)
    ? CAUSAS_QUE_FRENAN[g.causa] === true
    : S.faltAbierto[g.causa] === true;
  var frena = CAUSAS_QUE_FRENAN[g.causa] === true;

  var cabecera = '<div class="falt-head" data-causa="' + esc(g.causa) + '">' +
    '<div><div class="run-name">' + (frena ? '⚠ ' : '') + esc(g.texto) + '</div>' +
    '<div class="run-when">' + esc(g.oficio) + '</div></div>' +
    '<span class="run-count">' + num(g.cuenta_tokens) + ' token(s)' +
    (g.cuenta_filas !== g.cuenta_tokens ? ' · ' + num(g.cuenta_filas) + ' fila(s)' : '') +
    '</span></div>';

  if (!abierto) return '<div class="falt-grupo' + (frena ? ' is-frena' : '') + '">' + cabecera + '</div>';

  var cuerpo = g.tokens.map(function(t){
    /* ⭐ Los ítems van **tal cual llegan**, sin limpiar (Parte D): `enc_alcance_pct @: Salud`
     * muestra el separador crudo, y eso es un hallazgo sobre el parseo del nombre, no ruido.
     * Un nombre que la vista lava esconde el bug en el instrumento con el que se diagnostica
     * todo lo demás. */
    var items = t.items.length
      ? '<div class="run-when">en: ' + t.items.map(function(i){ return '<span class="mono">' + esc(i) + '</span>'; }).join(' · ') + '</div>'
      : '';
    var fuente = (t.base_id || t.solapa)
      ? '<div class="run-when"><span class="mono">' + esc(t.base_id) + (t.solapa ? '/' + esc(t.solapa) : '') + '</span></div>'
      : '';
    return '<li class="falt-token"><div class="run-name mono">' + esc(t.token) +
      (t.apariciones > 1 ? ' <span class="run-when">×' + num(t.apariciones) + '</span>' : '') + '</div>' +
      fuente + items +
      '<div class="falt-motivo">' + esc(t.motivo) + '</div></li>';
  }).join('');

  return '<div class="falt-grupo' + (frena ? ' is-frena' : '') + '">' + cabecera +
    '<ul class="list-reset falt-lista">' + cuerpo + '</ul></div>';
}

/* ⭐⭐ `2026-08-24_2` Parte C — **un grupo por lámina**, plegado salvo el que frena.
 *
 * ⚠ **La jerarquía sigue siendo por CONSECUENCIA y no por cantidad**, igual que en el corte por
 * causa: una lámina con un dato mal es más urgente que una con veinte sin cablear. Por eso lo que
 * abre el grupo es que tenga una causa de las que frenan, no su tamaño.
 *
 * ⚠ **Y el conteo de acá puede sumar más que el total**, a propósito: un token que aparece en
 * varias láminas falta **en todas**, y hacer que cierre sería mentir sobre el deck para que cierre
 * una suma. El total real está arriba, y las dos unidades van nombradas.
 */
function grupoLamina(g){
  var frena = g.causas.some(function(c){ return CAUSAS_QUE_FRENAN[c.causa] === true; });
  var clave = 'lam:' + g.lamina_id;
  var abierto = (S.faltAbierto[clave] === undefined) ? frena : S.faltAbierto[clave] === true;

  var cabecera = '<div class="falt-head" data-causa="' + esc(clave) + '">' +
    '<div><div class="run-name">' + (frena ? '⚠ ' : '') + '<span class="mono">' + esc(g.lamina_id) + '</span></div>' +
    '<div class="run-when">' + g.causas.map(function(c){
      return (CAUSAS_QUE_FRENAN[c.causa] ? '⚠ ' : '') + num(c.cuantos) + ' ' + esc(c.texto);
    }).join(' · ') + '</div></div>' +
    '<span class="run-count">' + num(g.cuenta_tokens) + ' token(s)' +
    (g.filas !== g.cuenta_tokens ? ' · ' + num(g.filas) + ' fila(s)' : '') + '</span></div>';

  if (!abierto) return '<div class="falt-grupo' + (frena ? ' is-frena' : '') + '">' + cabecera + '</div>';

  return '<div class="falt-grupo' + (frena ? ' is-frena' : '') + '">' + cabecera +
    '<ul class="list-reset falt-lista">' + g.tokens.map(function(t){
      return '<li class="falt-token"><div class="run-name mono">' + esc(t) + '</div></li>';
    }).join('') + '</ul></div>';
}

function vistaFaltantes(){
  if (S.falt === null){ cargarFaltantes(); return '<p class="muted">Leyendo lo que dejó la corrida…</p>'; }
  if (S.falt === 'cargando') return '<p class="muted">Leyendo lo que dejó la corrida…</p>';
  if (!S.falt.ok){
    return '<div class="alert alert-error"><div class="alert-title">No se pudo leer FALTANTES.</div>' +
      esc(S.falt.motivo || '') + '</div>';
  }

  var d = S.falt;
  var h = '';

  h += '<div class="falt-switch">' +
    '<button class="btn btn-secondary' + (d.cual==='actual'?' is-on':'') + '" data-cual="actual">Última corrida</button>' +
    '<button class="btn btn-secondary' + (d.cual==='previa'?' is-on':'') + '" data-cual="previa">La anterior</button>' +
    '</div>';

  if (!d.existe_hoja){
    h += '<div class="box">La hoja <span class="mono">' + esc(d.hoja) + '</span> todavía no existe. ' +
      (d.cual === 'previa'
        ? 'Se escribe recién cuando una segunda corrida pisa a la primera.'
        : 'Se escribe al cerrar una corrida.') + '</div>';
    return h;
  }

  /* ⭐ **Lo que frena la publicación va arriba y sin scroll.** Las alertas de acá no son
   * «muchos faltantes»: son «el motor hizo algo mal y no lo dijo». */
  var frenan = d.grupos.filter(function(g){ return CAUSAS_QUE_FRENAN[g.causa] === true; });
  if (frenan.length){
    h += '<div class="alert alert-error"><div class="alert-title">Algo salió mal en silencio.</div>' +
      frenan.map(function(g){
        return num(g.cuenta_tokens) + ' token(s) — ' + esc(g.texto) + ' · ' + esc(g.oficio);
      }).join('<br>') +
      '</div>';
  }

  /* ⚠ Más de un `corrida_id` en la hoja no es un detalle: `escribirFaltantes_` la pisa entera,
   * así que dos significa que una corrida murió antes del cierre y dejó la lista de otra
   * mezclada. Es el caso que costó medio día el 23/08. */
  if (d.corridas.length > 1){
    h += '<div class="alert alert-warning"><div class="alert-title">Hay ' + num(d.corridas.length) +
      ' corridas mezcladas en esta hoja.</div>Se pisa entera en cada corrida, así que debería haber una sola. ' +
      d.corridas.map(function(c){ return '<span class="mono">' + esc(c.corrida_id) + '</span> (' + num(c.filas) + ')'; }).join(' · ') +
      '</div>';
  }

  /* ⭐⭐ `2026-08-24_2` Parte B — **los tres números, y el que decide el cierre de fase va SOLO y
   * arriba.** Hasta hoy el conteo era uno y sumaba los tres: el número con el que se iba a declarar
   * `D-38` incluía 57 tokens de láminas que nadie va a cablear y el texto que escribe una persona.
   *
   * ⚠ **Los otros dos van al lado y en gris, no escondidos.** Que se descuenten no los vuelve
   * invisibles: quien mira tiene que poder ver **cuánto** se descontó, o el número de arriba pasa a
   * ser una afirmación sin testigo. */
  h += '<div class="falt-cierre">' +
    '<div class="falt-cierre-num">' + num(d.conteo.real) + '</div>' +
    '<div><div class="falt-cierre-tit">faltantes reales</div>' +
    '<div class="run-when">es el número que decide el cierre de fase. Los otros dos son trabajo ' +
    'que nadie va a hacer: están declarados así en <span class="mono">LAMINAS</span></div></div>' +
    '</div>';

  h += '<div class="stats">' +
    '<div class="stat"><div><div class="stat-label">Fuera de alcance</div>' +
    '<span class="stat-unit">la lámina entera no se cablea</span></div>' +
    '<div class="stat-value muted">' + num(d.conteo.fuera_de_alcance) + '</div></div>' +
    '<div class="stat"><div><div class="stat-label">Texto del equipo</div>' +
    '<span class="stat-unit">lo escribe una persona</span></div>' +
    '<div class="stat-value muted">' + num(d.conteo.texto_equipo) + '</div></div>' +
    '<div class="stat"><div><div class="stat-label">Filas en total</div>' +
    '<span class="stat-unit">' + num(d.tokens) + ' token(s) distintos</span></div>' +
    '<div class="stat-value muted">' + num(d.filas) + '</div></div>' +
    (d.corridas.length === 1
      ? '<div class="stat"><div><div class="stat-label">Corrida</div></div>' +
        '<div class="stat-value mono">' + esc(d.corridas[0].corrida_id) + '</div></div>'
      : '') +
    '</div>';

  /* ⭐ Parte C — **el mismo conteo, cortado por lámina**, que es como se mira un deck y como está
   * organizado `CIERRE_POR_LAMINA.md`. **Los dos cortes conviven a propósito**: por causa se
   * contesta *«qué oficio cierra esto»* y por lámina *«puedo publicar ésta»*. */
  h += '<div class="falt-switch">' +
    '<button class="btn btn-secondary' + (S.faltCorte!=='lamina'?' is-on':'') + '" data-corte="causa">Por causa</button>' +
    '<button class="btn btn-secondary' + (S.faltCorte==='lamina'?' is-on':'') + '" data-corte="lamina">Por lámina</button>' +
    '</div>';

  if (S.faltCorte === 'lamina'){
    h += d.laminas.length
      ? d.laminas.map(grupoLamina).join('')
      : '<div class="box">Ninguna fila dice de qué lámina viene. ' +
        'Se guarda desde el 25/08: hace falta una corrida nueva.</div>';
  } else {
    h += d.grupos.length
      ? d.grupos.map(grupoFaltante).join('')
      : '<div class="box">Esta corrida no dejó ningún faltante.</div>';
  }

  // La misma leyenda que la pantalla de listo: los símbolos se explican donde se los mira.
  h += leyendaSimbolos();

  /* ⚠ **Un instrumento declara qué NO contesta**, y va al final porque es lo que cambia cómo se lee
   * el número de arriba.
   *
   * ⛔ **`2026-08-24_2` — este bloque decía dos cosas que dejaron de ser ciertas hoy**, y dejarlo
   * habría sido el `var TECHO_S = 350` otra vez: el front declarando un límite que el backend ya no
   * tiene, **justo en el lugar donde la persona mira**. Ahora dice lo que queda abierto de verdad. */
  h += '<div class="box"><div class="section-title">Lo que este conteo no contesta</div>' +
    (d.declaracion && d.declaracion.columnas === false
      ? '<p class="muted">⛔ <strong>' + esc(d.declaracion.motivo || '') + '</strong></p>'
      : '') +
    (d.conteo.sin_declarar
      ? '<p class="muted"><strong>' + num(d.conteo.sin_declarar) + ' fila(s) están en láminas cuyo ' +
        'alcance nadie declaró</strong> — todo <span class="mono">secco</span> está así. No se suman ' +
        'a los faltantes reales: «nadie lo declaró» no es «está en alcance», y contarlas juntas ' +
        'metería en el número del cierre láminas que nadie miró.</p>'
      : '') +
    (d.sin_lamina
      ? '<p class="muted"><strong>' + num(d.sin_lamina) + ' fila(s) no dicen de qué lámina vienen.</strong> ' +
        'Son las que quedaron de una corrida anterior al 25/08 —cuando <span class="mono">FALTANTES</span> ' +
        'todavía no guardaba la lámina— o las que barrió un corte: ahí el <span class="mono">lamina_id</span> ' +
        'se deja vacío a propósito, para no gastar llamadas a la API dentro de la reserva de cierre.</p>'
      : '') +
    '<p class="muted">Y no dice si un número <strong>es correcto</strong>: dice si se pintó. ' +
    'Un token que publicó un valor de otro universo sale de acá como un acierto.</p></div>';

  return h;
}

function conectarFaltantes(){
  Array.prototype.forEach.call(document.querySelectorAll('.falt-switch button'), function(b){
    b.onclick = function(){
      var cual = b.getAttribute('data-cual');
      if (cual === S.faltCual) return;
      S.faltCual = cual;
      // Se relee: la vista no filtra una foto en memoria, pide la hoja que corresponde.
      cargarFaltantes();
      pintar();
    };
  });
  /* ⚠ El corte SÍ se resuelve en memoria y no relee, y la diferencia con el de arriba es real: allá
   * cambia **qué hoja** se lee, acá cambia **cómo se agrupa lo mismo**. Pedir la hoja de nuevo
   * daría otra foto y dos cortes de dos momentos, que es `C-80` en la pantalla. */
  Array.prototype.forEach.call(document.querySelectorAll('.falt-switch button[data-corte]'), function(b){
    b.onclick = function(){
      var corte = b.getAttribute('data-corte');
      if (corte === S.faltCorte) return;
      S.faltCorte = corte;
      pintar();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.falt-head'), function(cab){
    cab.onclick = function(){
      var causa = cab.getAttribute('data-causa');
      var abiertoAhora = (S.faltAbierto[causa] === undefined)
        ? CAUSAS_QUE_FRENAN[causa] === true
        : S.faltAbierto[causa] === true;
      S.faltAbierto[causa] = !abiertoAhora;
      pintar();
    };
  });
}

function vistaProximo(){
  var items = [
    ['Pegar el temario', 'Pegar la agenda y que el motor detecte los encuentros.'],
    ['Vista previa antes de generar', 'Ver las láminas que van a salir antes de esperar la corrida.'],
    ['Informe personalizado', 'Armar un informe agregando bloques por tipo. Diseñado, sin backend.'],
    ['Agregar un marcador desde el panel', 'Necesita su propio camino declarado en ESCRITORES.md.'],
    ['Aviso por mail al terminar', 'Para no tener que quedarse mirando la corrida.']
  ];
  return '<ul class="list-reset">' + items.map(function(it){
    return '<li class="run"><div><div class="run-name">' + esc(it[0]) + '</div>' +
      '<div class="run-when">' + esc(it[1]) + '</div></div></li>';
  }).join('') + '</ul>';
}

arrancar();
