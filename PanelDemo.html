<style>
/* ───────────────────────────────────────────────────────────────────────────────────────
 * Tokens — copiados tal cual de design/tokens/*.css (`_45`, 13/08/2026).
 * No se editan a mano: si el paquete de diseño cambia, se vuelven a copiar de ahí.
 * ─────────────────────────────────────────────────────────────────────────────────── */
:root{
--color-white:#ffffff;
--gray-50:#f8f9fa;--gray-100:#f1f3f4;--gray-200:#e8eaed;--gray-300:#dadce0;--gray-400:#bdc1c6;
--gray-500:#9aa0a6;--gray-600:#80868b;--gray-700:#5f6368;--gray-800:#3c4043;--gray-900:#202124;
--blue-50:#e8f0fe;--blue-500:#1a73e8;--blue-600:#1967d2;--blue-700:#185abc;
--red-50:#fce8e6;--red-600:#c5221f;
--amber-50:#fef7e0;--amber-600:#b06000;
--green-50:#e6f4ea;--green-600:#188038;
--text-primary:var(--gray-900);--text-secondary:var(--gray-700);--text-tertiary:var(--gray-600);
--text-disabled:var(--gray-500);--text-link:var(--blue-600);--text-on-primary:#ffffff;
--surface-page:#ffffff;--surface-sunken:var(--gray-50);--surface-hover:var(--gray-100);
--border-subtle:var(--gray-200);--border-default:var(--gray-300);
--color-primary:var(--blue-500);--color-primary-hover:var(--blue-600);--color-primary-active:var(--blue-700);
--surface-primary-subtle:var(--blue-50);
--color-error:var(--red-600);--surface-error-subtle:var(--red-50);
--color-warning:var(--amber-600);--surface-warning-subtle:var(--amber-50);
--color-success:var(--green-600);--surface-success-subtle:var(--green-50);
--color-disabled-bg:var(--gray-200);--color-disabled-fg:var(--gray-500);
--font-sans:'Roboto',Arial,sans-serif;
--text-2xs:11px;--text-xs:12px;--text-sm:13px;--text-base:14px;--text-md:16px;--text-lg:20px;--text-xl:24px;
--tracking-label:.4px;
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-pill:999px;
--shadow-sm:0 1px 2px rgba(60,64,67,.30),0 1px 3px 1px rgba(60,64,67,.15);
--ease-standard:cubic-bezier(.4,0,.2,1);--duration-fast:120ms;--duration-normal:200ms;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);font-size:var(--text-base);color:var(--text-primary);
  background:var(--surface-sunken);
  padding:var(--space-8) var(--space-6);
  display:flex;justify-content:center;align-items:flex-start;min-height:100vh;
}

/* La tarjeta. `overflow:hidden` para que la banda del pie respete el radio de 12. */
.panel{
  width:100%;max-width:560px;background:var(--surface-page);
  border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.panel-body{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}

/* ── Encabezado ───────────────────────────────────────────────────────────────────── */
.head{display:flex;flex-direction:column;gap:var(--space-3)}
/* `align-self:flex-start` es obligatorio: dentro de un flex column el logo se estira. */
.logo{height:22px;width:auto;align-self:flex-start;display:block}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
h1{font-size:var(--text-lg);font-weight:500;margin:0;line-height:1.2}
.chip{
  font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-label);
  border:1px solid var(--border-default);border-radius:var(--radius-pill);
  padding:3px 8px;color:var(--text-tertiary);white-space:nowrap;
}

/* ── Pestañas ─────────────────────────────────────────────────────────────────────── */
.tabs{
  display:flex;background:var(--surface-sunken);border-radius:var(--radius-pill);
  padding:3px;gap:2px;white-space:nowrap;
}
.tab{
  flex:1;border:0;background:transparent;font:inherit;font-size:var(--text-sm);
  color:var(--text-secondary);padding:6px 10px;border-radius:var(--radius-pill);
  cursor:pointer;transition:background var(--duration-fast) var(--ease-standard);
  display:flex;align-items:center;justify-content:center;gap:var(--space-1);
}
.tab:hover:not(.is-active){background:var(--surface-hover)}
.tab.is-active{background:var(--color-white);box-shadow:var(--shadow-sm);color:var(--text-primary);font-weight:500}
.tab-count{font-size:var(--text-2xs);color:var(--color-primary);font-weight:500}

/* ── Formularios ──────────────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:var(--space-2)}
label{font-size:var(--text-sm);font-weight:500;color:var(--text-secondary)}
select,input[type=text]{
  font:inherit;font-size:var(--text-base);color:var(--text-primary);
  padding:8px 10px;border:1px solid var(--border-default);border-radius:var(--radius-sm);
  background:var(--surface-page);width:100%;
}
select:focus,input[type=text]:focus{outline:2px solid var(--color-primary);outline-offset:-1px;border-color:transparent}
.hint{font-size:var(--text-xs);color:var(--text-tertiary);line-height:1.4}
.hint-error{font-size:var(--text-xs);color:var(--color-error);line-height:1.4}

.check{display:flex;align-items:flex-start;gap:var(--space-2);cursor:pointer}
.check input{margin:2px 0 0 0;accent-color:var(--color-primary);width:16px;height:16px;flex:none}
.check-text{display:flex;flex-direction:column;gap:2px}
.check-label{font-size:var(--text-sm);color:var(--text-primary)}
.check-sub{font-size:var(--text-xs);color:var(--text-tertiary)}

.btn{
  font:inherit;font-size:var(--text-base);font-weight:500;border-radius:var(--radius-sm);
  padding:10px 16px;cursor:pointer;border:1px solid transparent;width:100%;
  transition:background var(--duration-fast) var(--ease-standard);
}
.btn-primary{background:var(--color-primary);color:var(--text-on-primary)}
.btn-primary:hover:not(:disabled){background:var(--color-primary-hover)}
.btn-primary:active:not(:disabled){background:var(--color-primary-active)}
.btn-secondary{background:var(--surface-page);color:var(--color-primary);border-color:var(--border-default)}
.btn-secondary:hover:not(:disabled){background:var(--surface-hover)}
.btn:disabled{background:var(--color-disabled-bg);color:var(--color-disabled-fg);cursor:not-allowed;border-color:transparent}

/* ── Alert ────────────────────────────────────────────────────────────────────────── */
.alert{border-radius:var(--radius-md);padding:var(--space-3);font-size:var(--text-sm);line-height:1.4}
.alert-title{font-weight:500;margin-bottom:2px}
.alert-warning{background:var(--surface-warning-subtle);color:var(--color-warning)}
.alert-error{background:var(--surface-error-subtle);color:var(--color-error)}
.alert-info{background:var(--surface-primary-subtle);color:var(--text-link)}

/* ── DeckLinkCard ─────────────────────────────────────────────────────────────────── */
.deck{
  display:block;border:1px solid var(--border-default);border-radius:var(--radius-md);
  padding:var(--space-3);text-decoration:none;background:var(--surface-page);
  transition:background var(--duration-fast) var(--ease-standard);
}
.deck:hover{background:var(--surface-hover)}
.deck-name{font-size:var(--text-base);font-weight:500;color:var(--text-link);margin-bottom:2px}
.deck-meta{font-size:var(--text-xs);color:var(--text-tertiary)}

/* ── StatRow ──────────────────────────────────────────────────────────────────────── */
.stats{display:flex;flex-direction:column}
.stat{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle);
}
.stat:last-child{border-bottom:0}
.stat-label{font-size:var(--text-sm);color:var(--text-secondary)}
.stat-unit{font-size:var(--text-xs);color:var(--text-tertiary);display:block}
.stat-value{font-size:var(--text-md);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── StatusDot ────────────────────────────────────────────────────────────────────── */
.dot-row{display:flex;align-items:center;gap:var(--space-2);padding:3px 0;font-size:var(--text-sm)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot-on{background:var(--color-success)}
.dot-off{background:transparent;border:1px solid var(--border-strong,var(--gray-400))}

/* ── ProgressTimer ────────────────────────────────────────────────────────────────── */
.timer-top{display:flex;align-items:baseline;justify-content:space-between}
.timer-secs{font-size:var(--text-lg);font-variant-numeric:tabular-nums;font-weight:500}
.timer-stage{font-size:var(--text-xs);color:var(--text-tertiary)}
/* La regla NO avanza sola hacia 100 %: la banda marca el rango habitual y el marcador
 * se mueve con el tiempo real. Una barra que se llena sola sería una mentira. */
.rule{position:relative;height:6px;background:var(--gray-200);border-radius:var(--radius-pill);margin:var(--space-2) 0}
.rule-band{position:absolute;top:0;bottom:0;background:var(--blue-50);border-radius:var(--radius-pill)}
.rule-mark{
  position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--color-primary);
  transition:left var(--duration-normal) var(--ease-standard);
}
.rule-mark.is-warn{background:var(--color-warning)}
.rule-mark.is-danger{background:var(--color-error)}
.rule-scale{display:flex;justify-content:space-between;font-size:var(--text-2xs);color:var(--text-tertiary)}

/* ── RunHistoryItem ───────────────────────────────────────────────────────────────── */
.run{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle);
}
.run:last-child{border-bottom:0}
.run-name{font-size:var(--text-sm);font-weight:500}
.run-when{font-size:var(--text-xs);color:var(--text-tertiary)}
.run-when.is-dead{color:var(--color-error)}
.run-count{font-size:var(--text-xs);color:var(--text-tertiary);white-space:nowrap}

.sep{border:0;border-top:1px solid var(--border-subtle);margin:0}
.box{background:var(--surface-sunken);border-radius:var(--radius-md);padding:var(--space-3);font-size:var(--text-sm)}
.muted{font-size:var(--text-xs);color:var(--text-tertiary);line-height:1.4}
.list-reset{list-style:none;margin:0;padding:0}
.section-title{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-tertiary)}

/* ── Pie institucional, a sangre ──────────────────────────────────────────────────── */
.banner{display:block;width:100%;height:auto}
</style>

/* ── helpers, copiados de Panel.html ──────────────────────────────────────────────── */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(v){
  if (v == null || v === '') return '—';
  var n = Number(v);
  return isNaN(n) ? esc(v) : n.toLocaleString('es-AR');
}
function el(id){ return document.getElementById(id); }
function informeActual(){
  for (var i=0;i<INFORMES.length;i++) if (INFORMES[i].id === S.informeId) return INFORMES[i];
  return INFORMES[0];
}
function periodoActual(){
  for (var i=0;i<PERIODOS.length;i++) if (PERIODOS[i].id === S.periodoId) return PERIODOS[i];
  return PERIODOS[0];
}
/* Sólo `jm` tiene corridas: `secco` corrió una sola vez y no de estos períodos. */
function corridaPrevia(){
  if (S.informeId !== 'jm') return null;
  return CORRIDA_POR_PERIODO[S.periodoId] || null;
}
function deckCard(deckId, nombre, meta){
  return '<a class="deck" target="_blank" rel="noopener" ' +
    'href="https://docs.google.com/presentation/d/' + esc(deckId) + '/edit">' +
    '<div class="deck-name">' + esc(nombre) + '</div>' +
    '<div class="deck-meta">' + meta + '</div></a>';
}
function stat(label, unidad, valor){
  return '<div class="stat"><span class="stat-label">' + esc(label) +
    (unidad ? '<span class="stat-unit">' + esc(unidad) + '</span>' : '') +
    '</span><span class="stat-value">' + num(valor) + '</span></div>';
}

/* ── pintado ─────────────────────────────────────────────────────────────────────── */
function pintar(){
  pintarTabs();
  var c = el('cuerpo');
  if (S.tab === 'temario')  { c.innerHTML = vistaTemario();  conectarTemario();  return; }
  if (S.tab === 'anclajes') { c.innerHTML = vistaAnclajes(); conectarAnclajes(); return; }
  if (S.tab === 'corridas') { c.innerHTML = vistaCorridas(); return; }
  c.innerHTML = vistaGenerar();
  conectarGenerar();
}

function pintarTabs(){
  var tabs = [
    { id:'generar',  txt:'Generar' },
    { id:'temario',  txt:'Temario' },
    { id:'anclajes', txt:'Anclajes' },
    { id:'corridas', txt:'Corridas' }
  ];
  el('tabs').innerHTML = tabs.map(function(t){
    return '<button class="tab' + (S.tab===t.id?' is-active':'') + '" data-tab="' + t.id + '">' +
      esc(t.txt) + '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    b.onclick = function(){ S.tab = b.getAttribute('data-tab'); pintar(); };
  });
}

/* ── 1 · Generar ─────────────────────────────────────────────────────────────────── */
function vistaGenerar(){
  if (S.estado === 'generando') return vistaEsperando();
  if (S.estado === 'listo')     return vistaListo();

  var inf = informeActual();
  var previa = corridaPrevia();
  var h = '';

  h += '<div class="field"><label for="f-informe">Informe</label>' +
       '<select id="f-informe">' +
       INFORMES.map(function(i){
         return '<option value="' + esc(i.id) + '"' + (i.id===S.informeId?' selected':'') + '>' +
           esc(i.nombre) + '</option>';
       }).join('') + '</select>';
  if (inf.enDesarrollo){
    h += '<p class="hint"><span class="chip">en desarrollo</span></p>';
  }
  h += '</div>';

  h += '<div class="field"><label for="f-periodo">Período</label>' +
       '<select id="f-periodo">' +
       PERIODOS.map(function(p){
         return '<option value="' + esc(p.id) + '"' + (p.id===S.periodoId?' selected':'') + '>' +
           esc(p.desde) + ' → ' + esc(p.hasta) + '</option>';
       }).join('') + '</select>' +
       '<p class="hint">Si no elegís, sale la semana del informe vigente. Podés cambiarlo en la lista.</p></div>';

  /* El selector de secciones va SIEMPRE, haya deck o no. En el panel real hoy queda tapado
   * por el `return` temprano de la vía rápida; acá se muestra, que es como va a quedar. */
  h += '<hr class="sep">';
  h += '<div class="field"><span class="section-title">Secciones repetibles</span>';
  h += SECCIONES.map(function(s){
    return '<label class="check"><input type="checkbox" data-seccion="' + esc(s.id) + '"' +
      (S.secciones[s.id]?' checked':'') + '>' +
      '<span class="check-text"><span class="check-label">' + esc(s.id) + '</span>' +
      '<span class="check-sub">una lámina por cada una de las ' + esc(s.itera) + '</span>' +
      '</span></label>';
  }).join('');
  h += '<p class="hint">Sacar una acorta la corrida.</p></div>';

  if (previa && !S.forzarForm){
    h += '<hr class="sep">';
    h += '<p class="hint">Ya hay un deck generado para este período: se abre al instante.</p>';
    h += deckCard(previa.deck_id, inf.nombre,
      'Generado el ' + esc(previa.fecha) + ' · ' + previa.laminas + ' láminas');
    h += '<button class="btn btn-secondary" id="b-denuevo">Generar de nuevo, a sabiendas</button>';
    return h;
  }

  if (previa && S.forzarForm){
    h += '<div class="alert alert-warning">Ya existe un deck de este período. Esto genera otro y ' +
         'tarda entre 120 y 320 s igual.</div>';
  }

  h += '<label class="check"><input type="checkbox" id="f-raya" checked>' +
       '<span class="check-text"><span class="check-label">Los huecos se ven como «—»</span></span></label>';
  h += '<button class="btn btn-primary" id="b-generar">Generar informe</button>';
  return h;
}

function conectarGenerar(){
  var fi = el('f-informe');
  if (fi) fi.onchange = function(){ S.informeId = fi.value; S.forzarForm = false; pintar(); };
  var fp = el('f-periodo');
  if (fp) fp.onchange = function(){ S.periodoId = fp.value; S.forzarForm = false; pintar(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-seccion]'), function(cb){
    cb.onchange = function(){ S.secciones[cb.getAttribute('data-seccion')] = cb.checked; };
  });
  var bd = el('b-denuevo');
  if (bd) bd.onclick = function(){ S.forzarForm = true; pintar(); };
  var bg = el('b-generar');
  if (bg) bg.onclick = arrancarFalsa;
  var bo = el('b-otro');
  if (bo) bo.onclick = function(){ S.estado = 'form'; S.forzarForm = false; pintar(); };
}

/* ── 2 · Esperando ───────────────────────────────────────────────────────────────── */
/* El reloj corre de verdad, pero la corrida termina sola a los 6 s: el video no puede
 * esperar los 200 s que tarda la de verdad. Es lo único que se acelera. */
function arrancarFalsa(){
  S.estado = 'generando';
  S.elapsed = 0;
  pintar();
  if (S.timer) clearInterval(S.timer);
  S.timer = setInterval(function(){
    S.elapsed += 1;
    if (S.elapsed >= 6){
      clearInterval(S.timer); S.timer = null;
      S.estado = 'listo';
      pintar();
      return;
    }
    pintarTimer();
  }, 1000);
}

function vistaEsperando(){
  return '<div id="timer">' + timerHtml() + '</div>' +
    '<p class="hint">Una corrida completa tarda entre tres y cinco minutos: copia la plantilla, ' +
    'arma una lámina por cada encuentro y busca cada dato en su fuente.</p>' +
    '<hr class="sep">' +
    '<p class="hint">Si se cierra esta ventana la corrida sigue en el servidor. Al volver a abrir ' +
    'el panel, va a aparecer en «Corridas» cuando termine.</p>';
}

function timerHtml(){
  var pct = Math.min(100, (S.elapsed / TECHO_S) * 100);
  var clase = S.elapsed > (TECHO_S - 30) ? ' is-danger' : (S.elapsed > RANGO_S[1] ? ' is-warn' : '');
  var bandaL = (RANGO_S[0] / TECHO_S) * 100;
  var bandaW = ((RANGO_S[1] - RANGO_S[0]) / TECHO_S) * 100;
  var etapa = S.elapsed < 2 ? 'copiando la plantilla'
            : (S.elapsed < 4 ? 'armando las láminas' : 'buscando los datos');
  return '<div class="timer-top"><span class="timer-secs">' + S.elapsed + ' s</span>' +
    '<span class="timer-stage">' + esc(etapa) + '</span></div>' +
    '<div class="rule">' +
      '<div class="rule-band" style="left:' + bandaL + '%;width:' + bandaW + '%"></div>' +
      '<div class="rule-mark' + clase + '" style="left:' + pct + '%"></div>' +
    '</div>' +
    '<div class="rule-scale"><span>0 s</span><span>rango habitual 120–320 s</span><span>techo ' + TECHO_S + ' s</span></div>';
}
function pintarTimer(){ var t = el('timer'); if (t) t.innerHTML = timerHtml(); }

/* ── 3 · Terminó ─────────────────────────────────────────────────────────────────── */
/* Los conteos salen de la corrida real de ESE período. Si el período elegido no tiene
 * corrida propia, se muestra la del 24–30/07 **y la tarjeta dice de cuál es**: preferible a
 * inventar tres números para que la pantalla quede completa. */
function vistaListo(){
  var pid = CORRIDA_POR_PERIODO[S.periodoId] ? S.periodoId : 'julio_24_30';
  var c = CORRIDA_POR_PERIODO[pid];
  var inf = informeActual();
  var h = '';

  h += deckCard(c.deck_id, inf.nombre,
    esc(pid) + ' · ' + c.laminas + ' láminas · generado el ' + esc(c.fecha));

  h += '<div class="stats">' +
    stat('Datos distintos en el deck', '', c.distintos) +
    stat('Valores impresos', 'dato × lámina', c.impresos) +
    stat('Datos que faltaron', 'uno por dato y por lámina', c.faltaron) +
    '</div>';

  h += '<p class="muted">Los huecos se imprimieron como una raya. La corrida tardó ' +
    c.segundos + ' s de un techo de ' + TECHO_S + ' s.</p>';

  h += '<div><span class="section-title">Secciones repetibles</span><ul class="list-reset">' +
    SECCIONES.map(function(s){
      return '<li class="dot-row"><span class="dot ' + (S.secciones[s.id]?'dot-on':'dot-off') + '"></span>' +
        esc(s.id) + '</li>';
    }).join('') + '</ul></div>';

  h += '<button class="btn btn-secondary" id="b-otro">Generar otro</button>';
  return h;
}

/* ── 4 · Temario ─────────────────────────────────────────────────────────────────── */
function vistaTemario(){
  var filas = TEMARIO[S.periodoId] || [];
  var h = '';

  h += '<div class="field"><label for="t-periodo">Período</label>' +
       '<select id="t-periodo">' +
       PERIODOS.map(function(p){
         return '<option value="' + esc(p.id) + '"' + (p.id===S.periodoId?' selected':'') + '>' +
           esc(p.desde) + ' → ' + esc(p.hasta) + '</option>';
       }).join('') + '</select></div>';

  h += '<div class="field"><label for="t-texto">Pegá el temario de la semana</label>' +
       '<textarea id="t-texto" rows="5" style="font:inherit;font-size:var(--text-sm);' +
       'padding:8px 10px;border:1px solid var(--border-default);border-radius:var(--radius-sm);' +
       'width:100%;resize:vertical" placeholder="Una línea por encuentro, como llegan por WhatsApp">' +
       esc(filas.map(function(f){ return f.texto; }).join('\n')) + '</textarea>' +
       '<p class="hint">Esto <strong>no carga nada</strong>: muestra qué entendió el motor de cada ' +
       'línea, para revisarlo antes de cargarlo.</p></div>';

  h += '<button class="btn btn-primary" id="b-temario">Ver qué se entendió</button>';

  if (S.temarioMostrado){
    h += '<hr class="sep">';
    if (!filas.length){
      h += '<p class="muted">Este período no tiene temario cargado.</p>';
      return h;
    }
    h += '<div><span class="section-title">' + filas.length + ' líneas interpretadas</span>';
    h += filas.map(function(f){
      var partes = [f.eje, f.tipo || '(sin tipo)', f.fecha];
      if (f.etapa) partes.push(f.etapa);
      return '<div class="run"><div>' +
        '<div class="run-name">' + esc(f.nombre) + '</div>' +
        '<div class="run-when">' + esc(partes.join(' · ')) + '</div></div>' +
        '<span class="run-count">' + esc(f.eje) + '</span></div>';
    }).join('');
    h += '</div>';
    h += '<p class="muted">Ninguna línea quedó sin interpretar.</p>';
  }
  return h;
}

function conectarTemario(){
  var tp = el('t-periodo');
  if (tp) tp.onchange = function(){ S.periodoId = tp.value; S.temarioMostrado = false; pintar(); };
  var bt = el('b-temario');
  if (bt) bt.onclick = function(){ S.temarioMostrado = true; pintar(); };
}

/* ── 5 · Anclajes ────────────────────────────────────────────────────────────────── */
/* La pantalla que hoy no existe en el backend. Los puntajes son los medidos para
 * `junio_sem2`: tres encuentros pasan el umbral y `Educación 16/06` queda en 0,54. */
function vistaAnclajes(){
  var bajos = ANCLAJES.filter(function(a){ return a.puntaje < UMBRAL_ANCLAJE; });
  var h = '';

  h += '<p class="hint">El motor asocia cada encuentro del temario con su campaña digital. ' +
       'Cuando no está seguro, no elige: lo deja acá para que lo confirme una persona.</p>';
  h += '<hr class="sep">';

  h += '<div><span class="section-title">Semana del 12/06 al 18/06</span>';
  h += ANCLAJES.map(function(a){
    var ok = a.puntaje >= UMBRAL_ANCLAJE;
    return '<div class="run"><div>' +
      '<div class="run-name">' + esc(a.item) + ' ' + esc(a.fecha) + '</div>' +
      '<div class="run-when' + (ok?'':' is-dead') + '">' +
      (a.campana ? esc(a.campana) : 'sin campaña asociada') + '</div></div>' +
      '<span class="run-count">' + a.puntaje.toFixed(2) + '</span></div>';
  }).join('');
  h += '</div>';

  if (bajos.length){
    var b = bajos[0];
    h += '<hr class="sep">';
    h += '<div class="alert alert-warning"><div class="alert-title">Falta confirmar uno</div>' +
         esc(b.item) + ' ' + esc(b.fecha) + ' quedó en ' + b.puntaje.toFixed(2) +
         ', por debajo del ' + UMBRAL_ANCLAJE.toFixed(2) + ' que hace falta para asociarlo solo.</div>';
    h += '<div class="field"><span class="section-title">Candidata</span>' +
         '<label class="check"><input type="radio" name="anc" value="si"' +
         (S.anclajeElegido==='si'?' checked':'') + '>' +
         '<span class="check-text"><span class="check-label">' + esc(b.campana) + '</span>' +
         '<span class="check-sub">cuenta ' + esc(b.cuenta) + ' · coincide en fecha, no en nombre</span>' +
         '</span></label>' +
         '<label class="check"><input type="radio" name="anc" value="no"' +
         (S.anclajeElegido==='no'?' checked':'') + '>' +
         '<span class="check-text"><span class="check-label">Ninguna</span>' +
         '<span class="check-sub">el encuentro sale sin datos digitales</span>' +
         '</span></label></div>';
    h += '<button class="btn btn-primary" id="b-anclar"' +
         (S.anclajeElegido?'':' disabled') + '>Confirmar</button>';
    if (S.anclajeElegido){
      h += '<p class="muted">En la maqueta el botón no escribe nada.</p>';
    }
  }
  return h;
}

function conectarAnclajes(){
  Array.prototype.forEach.call(document.querySelectorAll('input[name=anc]'), function(r){
    r.onchange = function(){ S.anclajeElegido = r.value; pintar(); };
  });
}

/* ── 6 · Corridas ────────────────────────────────────────────────────────────────── */
function vistaCorridas(){
  var nombres = {};
  INFORMES.forEach(function(i){ nombres[i.id] = i.nombre; });
  var h = '<p class="muted">Mostrando ' + CORRIDAS.length + ' de 51 corridas registradas.</p>';
  h += CORRIDAS.map(function(c){
    if (!c.cerrada){
      return '<div class="run"><div>' +
        '<div class="run-name">' + esc(nombres[c.informe_id]) + '</div>' +
        '<div class="run-when is-dead">no terminó — no dejó deck</div></div>' +
        '<span class="run-count">' + esc(c.periodo_id) + '</span></div>';
    }
    return '<div style="padding:var(--space-2) 0">' +
      deckCard(c.deck_id, nombres[c.informe_id],
        esc(c.periodo_id) + ' · ' + esc(c.fecha)) + '</div>';
  }).join('');
  return h;
}

pintar();
</script>

</body>
</html>
